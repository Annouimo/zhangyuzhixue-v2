<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>试卷预览 - 章鱼智学</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .question-item {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      background: var(--card);
      border-radius: var(--radius-sm);
      margin-bottom: 6px;
      box-shadow: var(--shadow);
      font-size: 13px;
    }
    .question-item .q-info { flex: 1; }
    .question-item .q-btn {
      flex-shrink: 0;
      margin-left: 8px;
      padding: 6px 12px;
      border: 1px solid var(--primary);
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--primary);
      font-size: 12px;
      cursor: pointer;
      text-decoration: none;
    }
    .question-item .q-btn:hover { background: var(--primary-light); }
  </style>
</head>
<body>
  <div class="page-header">
    <a href="exam.html" class="back-btn">← 返回</a>
    <h1>试卷预览</h1>
  </div>

  <div class="page" style="padding-top:8px;">
    <!-- 试卷名称 -->
    <div class="card">
      <div style="font-size:17px;font-weight:600;" data-db="exam.preview.name">我的练习卷</div>
      <div class="text-secondary" style="font-size:13px;margin-top:4px;" data-db="exam.preview.summary">
        选择 <span data-db="exam.preview.choiceCount">2</span> 题
        · 填空 <span data-db="exam.preview.fillCount">0</span> 题
        · 解答 <span data-db="exam.preview.solutionCount">0</span> 题
        · 共 <span data-db="exam.preview.totalCount">2</span> 题
      </div>
    </div>

    <!-- 操作按钮（放在题目列表前面，因题目较多时会很长） -->
    <div class="flex gap-2 mt-4">
      <button class="btn btn-outline flex-1" data-db-action="exam.downloadPdf()">下载 PDF</button>
      <a href="answer_sheet.html" class="btn btn-outline flex-1" data-db-action="exam.quickAnswer()">快对答案</a>
      <button class="btn btn-ghost flex-1" style="color:var(--error);" data-db-action="exam.deleteExam()">删除</button>
    </div>

    <!-- 题目列表 -->
    <h3 style="font-size:15px;font-weight:600;margin:12px 0 8px;">已选题目</h3>
    <div data-db-loop="exam.preview.questions">
      <div class="question-item">
        <div class="q-info">
          <div data-db="exam.preview.questions[].title">2025 东城一模 第 1 题</div>
          <div class="text-secondary" data-db="exam.preview.questions[].meta">选择题 · 难度 0.3 · 计算量 1.2</div>
        </div>
        <a href="solve.html" class="q-btn" data-db-action="question.startSolve(1)">做题</a>
      </div>
      <div class="question-item">
        <div class="q-info">
          <div data-db="exam.preview.questions[].title">2025 东城一模 第 2 题</div>
          <div class="text-secondary" data-db="exam.preview.questions[].meta">选择题 · 难度 0.5 · 计算量 1.8</div>
        </div>
        <a href="solve.html" class="q-btn" data-db-action="question.startSolve(2)">做题</a>
      </div>
    </div>
  </div>
</body>
</html>
