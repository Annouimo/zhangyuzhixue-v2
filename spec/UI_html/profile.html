<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的 - 章鱼智学</title>
  <!-- 等级徽章使用 CSS 变量 --primary: #4A6CF7 -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="has-nav">
  <!-- 用户信息卡片（可点击→等级详情） -->
  <a href="level_detail.html" class="card" style="margin:16px;display:block;text-decoration:none;color:inherit;text-align:center;padding:24px;cursor:pointer;">
    <div style="font-size:48px;margin-bottom:8px;">👤</div>
    <h2 style="font-size:20px;font-weight:700;" data-db="user.getInfo.realName">李小红</h2>
    <p class="text-secondary" style="font-size:14px;">
      学号：<span data-db="user.getInfo.studentId">2026001</span>
    </p>
    <div style="margin-top:8px;font-size:14px;">
      <span style="background:var(--primary);color:#fff;padding:2px 12px;border-radius:20px;font-weight:600;">
        🏅 Lv.<span data-db="user.getInfo.level">5</span>
      </span>
      <span class="text-secondary" style="margin-left:12px;">
        可用积分 <span data-db="user.getInfo.availablePoints">17.0</span>
      </span>
    </div>
    <div class="text-muted" style="font-size:12px;margin-top:6px;color:var(--text-muted);">
      查看等级详情 →
    </div>
  </a>

  <!-- 功能入口 -->
  <div class="page" style="padding-top:0;">
    <a href="achievement.html" class="list-item">
      <div class="left">
        <div class="title">🏆 成就</div>
        <div class="subtitle" data-db="achievement.unlockedCount">已解锁 5 个</div>
      </div>
      <div class="right">→</div>
    </a>

    <a href="statistics.html" class="list-item">
      <div class="left">
        <div class="title">📊 学习统计</div>
        <div class="subtitle">共 <span data-db="stats.totalQuestions">32</span> 题 · 正确率 <span data-db="stats.accuracy">78%</span></div>
      </div>
      <div class="right">→</div>
    </a>

    <a href="question_history.html" class="list-item">
      <div class="left">
        <div class="title">📝 做题历史</div>
        <div class="subtitle" data-db="user.getAnswerHistory.count">共 32 题</div>
      </div>
      <div class="right">→</div>
    </a>

    <a href="preference_list.html" class="list-item">
      <div class="left">
        <div class="title">📋 学习偏好</div>
        <div class="subtitle" data-db="preference.count">已设置 2 个偏好</div>
      </div>
      <div class="right">→</div>
    </a>

    <a href="points.html" class="list-item">
      <div class="left">
        <div class="title">💰 积分流水</div>
        <div class="subtitle">累计 <span data-db="user.getInfo.accumulatedPoints">22.0</span> · 可用 <span data-db="user.getInfo.availablePoints">17.0</span></div>
      </div>
      <div class="right">→</div>
    </a>

    <!-- 调试入口 - 正式版删除 -->
    <a href="debug.html" class="list-item" style="margin-top:16px;border:1px dashed var(--text-muted);opacity:0.5;">
      <div class="left">
        <div class="title" style="font-size:12px;color:var(--text-muted);">⚙️ 调试工具</div>
        <div class="subtitle" style="font-size:10px;">仅开发用，正式版删除该入口</div>
      </div>
      <div class="right">→</div>
    </a>

    <a href="login.html" class="list-item" style="border:1px solid var(--error);">
      <div class="left">
        <div class="title" style="color:var(--error);">退出登录</div>
      </div>
      <div class="right">→</div>
    </a>
  </div>

  <nav class="bottom-nav">
    <a href="homework.html" class="nav-item">
      <span class="nav-icon">📚</span>
      <span>作业</span>
    </a>
    <a href="recommend.html" class="nav-item">
      <span class="nav-icon">🔍</span>
      <span>推荐</span>
    </a>
    <a href="exam.html" class="nav-item">
      <span class="nav-icon">📄</span>
      <span>组卷</span>
    </a>
    <a href="profile.html" class="nav-item active">
      <span class="nav-icon">👤</span>
      <span>我的</span>
    </a>
  </nav>
</body>
</html>
