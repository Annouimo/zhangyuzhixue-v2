<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>组卷 - 章鱼智学</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="has-nav">
  <div class="page-header">
    <h1>组卷</h1>
  </div>

  <div class="page" style="padding-top:8px;">
    <!-- 新组卷入口 -->
    <div class="card" style="margin-bottom:16px;">
      <div style="font-size:15px;font-weight:600;margin-bottom:12px;">新组卷</div>
      <a href="paper_auto.html" class="btn btn-primary btn-block" style="margin-bottom:8px;">
        🤖 智能组卷 · 消耗 10 积分
      </a>
      <a href="paper_pick.html" class="btn btn-primary btn-block">
        🖐 自主选题 · 消耗 20 积分
      </a>
    </div>

    <!-- 组卷历史 -->
    <div data-db-loop="exam.getMyExams" data-db-empty="暂无组卷记录">

      <div class="card">
        <a href="paper_quicklook.html" style="display:block;text-decoration:none;color:inherit;cursor:pointer;">
          <div class="flex items-center justify-between">
            <div>
              <div style="font-size:15px;font-weight:600;" data-db="exam.getMyExams[].name">导数练习卷</div>
              <div class="text-secondary" style="font-size:12px;margin-top:2px;" data-db="exam.getMyExams[].createdAt">2025-03-14</div>
            </div>
            <div class="text-secondary" style="font-size:12px;" data-db="exam.getMyExams[].summary">
              选择 2 题 · 填空 0 题 · 解答 1 题 · 共 3 题
            </div>
          </div>
        </a>
        <div class="paper-actions mt-2" style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn btn-outline btn-sm" data-db-action="exam.downloadPdf(1)">下载 PDF</button>
          <a href="answer_sheet.html" class="btn btn-outline btn-sm" data-db-action="exam.quickAnswer(1)">快对答案</a>
          <button class="btn btn-ghost btn-sm" style="color:var(--error);" data-db-action="exam.deleteExam(1)">删除</button>
        </div>
      </div>

      <div class="card">
        <a href="paper_quicklook.html" style="display:block;text-decoration:none;color:inherit;cursor:pointer;">
          <div class="flex items-center justify-between">
            <div>
              <div style="font-size:15px;font-weight:600;" data-db="exam.getMyExams[].name">三角函数专项</div>
              <div class="text-secondary" style="font-size:12px;margin-top:2px;" data-db="exam.getMyExams[].createdAt">2025-03-10</div>
            </div>
            <div class="text-secondary" style="font-size:12px;" data-db="exam.getMyExams[].summary">
              选择 5 题 · 填空 3 题 · 解答 0 题 · 共 8 题
            </div>
          </div>
        </a>
        <div class="paper-actions mt-2" style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn btn-outline btn-sm" data-db-action="exam.downloadPdf(2)">下载 PDF</button>
          <a href="answer_sheet.html" class="btn btn-outline btn-sm" data-db-action="exam.quickAnswer(2)">快对答案</a>
          <button class="btn btn-ghost btn-sm" style="color:var(--error);" data-db-action="exam.deleteExam(2)">删除</button>
        </div>
      </div>

      <div class="card">
        <a href="paper_quicklook.html" style="display:block;text-decoration:none;color:inherit;cursor:pointer;">
          <div class="flex items-center justify-between">
            <div>
              <div style="font-size:15px;font-weight:600;" data-db="exam.getMyExams[].name">期末冲刺</div>
              <div class="text-secondary" style="font-size:12px;margin-top:2px;" data-db="exam.getMyExams[].createdAt">2025-03-01</div>
            </div>
            <div class="text-secondary" style="font-size:12px;" data-db="exam.getMyExams[].summary">
              选择 3 题 · 填空 2 题 · 解答 4 题 · 共 9 题
            </div>
          </div>
        </a>
        <div class="paper-actions mt-2" style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn btn-outline btn-sm" data-db-action="exam.downloadPdf(3)">下载 PDF</button>
          <a href="answer_sheet.html" class="btn btn-outline btn-sm" data-db-action="exam.quickAnswer(3)">快对答案</a>
          <button class="btn btn-ghost btn-sm" style="color:var(--error);" data-db-action="exam.deleteExam(3)">删除</button>
        </div>
      </div>

    </div>
  </div>

  <nav class="bottom-nav">
    <a href="homework.html" class="nav-item">
      <span class="nav-icon">📚</span>
      <span>作业</span>
    </a>
    <a href="recommend.html" class="nav-item">
      <span class="nav-icon">🔍</span>
      <span>推荐</span>
    </a>
    <a href="exam.html" class="nav-item active">
      <span class="nav-icon">📄</span>
      <span>组卷</span>
    </a>
    <a href="profile.html" class="nav-item">
      <span class="nav-icon">👤</span>
      <span>我的</span>
    </a>
  </nav>
</body>
</html>
