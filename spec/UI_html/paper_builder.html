<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自主组卷 - 章鱼智学</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .selected-count {
      font-size: 13px;
      color: var(--primary);
      font-weight: 600;
    }
    .question-item {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      background: var(--card);
      border-radius: var(--radius-sm);
      margin-bottom: 6px;
      box-shadow: var(--shadow);
      font-size: 13px;
    }
    .question-item .q-info { flex: 1; }
    .question-item .q-add {
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--card);
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .question-item .q-add.selected { background: var(--primary); color: #fff; border-color: var(--primary); }

    /* 双头范围选择器 */
    .dual-range {
      position: relative;
      height: 36px;
    }
    .dual-range input[type="range"] {
      position: absolute;
      width: 100%;
      height: 6px;
      top: 14px;
      margin: 0;
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      pointer-events: none;
    }
    .dual-range input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: var(--primary);
      border: 2px solid #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
      cursor: pointer;
      pointer-events: all;
    }
    .dual-range input[type="range"]::-moz-range-thumb {
      width: 20px; height: 20px;
      border-radius: 50%;
      background: var(--primary);
      border: 2px solid #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
      cursor: pointer;
      pointer-events: all;
    }
    .dual-range .rail {
      position: absolute;
      top: 14px; left: 0; right: 0;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
    }
    .dual-range .fill {
      position: absolute;
      top: 14px;
      height: 6px;
      background: var(--primary);
      border-radius: 3px;
    }
    .dual-labels {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div class="page-header">
    <a href="exam.html" class="back-btn">← 返回</a>
    <h1>自主组卷</h1>
  </div>

  <div class="page" style="padding-top:8px;">
    <!-- 试卷名称 -->
    <div class="input-group">
      <label>试卷名称</label>
      <input type="text" placeholder="输入试卷名称" data-db-bind="exam.build.name" value="我的练习卷">
    </div>

    <!-- 筛选区域 -->
    <div class="paper-filter-area">
      <button class="btn btn-outline btn-block mt-2 mb-4" data-db-action="exam.clearFilters()">
        清除所有筛选条件
      </button>

      <div class="filter-section">
        <div class="filter-header" onclick="toggleFilter(this)">
          <span>按来源筛选</span>
          <span>▾</span>
        </div>
        <div class="filter-body">
          <div class="mb-4">
            <label style="font-size:13px;font-weight:500;display:block;margin-bottom:4px;">年份</label>
            <div class="flex gap-2" data-db-loop="question.filter.years">
              <label style="font-size:13px;"><input type="checkbox" checked> 2025</label>
              <label style="font-size:13px;"><input type="checkbox"> 2024</label>
              <label style="font-size:13px;"><input type="checkbox"> 2023</label>
            </div>
          </div>
          <div>
            <label style="font-size:13px;font-weight:500;display:block;margin-bottom:4px;">地区</label>
            <div class="flex gap-2" data-db-loop="question.filter.regions">
              <label style="font-size:13px;"><input type="checkbox" checked> 海淀</label>
              <label style="font-size:13px;"><input type="checkbox" checked> 东城</label>
              <label style="font-size:13px;"><input type="checkbox"> 西城</label>
              <label style="font-size:13px;"><input type="checkbox"> 朝阳</label>
            </div>
          </div>
          <div class="mt-2">
            <label style="font-size:13px;font-weight:500;display:block;margin-bottom:4px;">考试</label>
            <div class="flex gap-2">
              <label style="font-size:13px;"><input type="checkbox" checked> 一模</label>
              <label style="font-size:13px;"><input type="checkbox"> 二模</label>
              <label style="font-size:13px;"><input type="checkbox"> 期末</label>
            </div>
          </div>
        </div>
      </div>

      <div class="filter-section">
        <div class="filter-header" onclick="toggleFilter(this)">
          <span>按概念标签筛选</span>
          <span>▾</span>
        </div>
        <div class="filter-body">
          <p class="text-secondary" style="font-size:13px;" data-db-loop="question.filter.conceptTags">
            <label style="display:inline-block;margin-right:8px;margin-bottom:4px;font-size:13px;">
              <input type="checkbox"> 集合</label>
            <label style="display:inline-block;margin-right:8px;margin-bottom:4px;font-size:13px;">
              <input type="checkbox"> 函数</label>
            <label style="display:inline-block;margin-right:8px;margin-bottom:4px;font-size:13px;">
              <input type="checkbox"> 导数</label>
            <label style="display:inline-block;margin-right:8px;margin-bottom:4px;font-size:13px;">
              <input type="checkbox"> 三角函数</label>
            <label style="display:inline-block;margin-right:8px;margin-bottom:4px;font-size:13px;">
              <input type="checkbox"> 数列</label>
          </p>
        </div>
      </div>

      <div class="filter-section">
        <div class="filter-header" onclick="toggleFilter(this)">
          <span>按知识卡片筛选</span>
          <span>▾</span>
        </div>
        <div class="filter-body">
          <p class="text-secondary" style="font-size:13px;" data-db-loop="question.filter.knowledgeCards">
            <label style="display:block;margin-bottom:4px;font-size:13px;">
              <input type="checkbox"> 正弦定理</label>
            <label style="display:block;margin-bottom:4px;font-size:13px;">
              <input type="checkbox"> 余弦定理</label>
            <label style="display:block;margin-bottom:4px;font-size:13px;">
              <input type="checkbox"> 辅助角公式</label>
          </p>
        </div>
      </div>

      <div class="filter-section">
        <div class="filter-header" onclick="toggleFilter(this)">
          <span>按难度/计算量筛选</span>
          <span>▾</span>
        </div>
        <div class="filter-body">
          <!-- 批语落实：双头范围选择器 -->
          <div class="mb-2">
            <div style="font-size:13px;font-weight:500;margin-bottom:4px;">难度</div>
            <div class="dual-range" id="difficulty-range">
              <div class="rail"></div>
              <div class="fill" id="difficulty-fill"></div>
              <input type="range" min="0" max="10" value="2" step="0.5"
                     id="difficulty-min" oninput="syncDualRange('difficulty')"
                     data-db-bind="question.search.diffMin">
              <input type="range" min="0" max="10" value="8" step="0.5"
                     id="difficulty-max" oninput="syncDualRange('difficulty')"
                     data-db-bind="question.search.diffMax">
            </div>
            <div class="dual-labels">
              <span>最小值：<span id="difficulty-min-label" data-db="question.search.diffMin">2</span></span>
              <span>最大值：<span id="difficulty-max-label" data-db="question.search.diffMax">8</span></span>
            </div>
          </div>
          <div>
            <div style="font-size:13px;font-weight:500;margin-bottom:4px;">计算量</div>
            <div class="dual-range" id="calculation-range">
              <div class="rail"></div>
              <div class="fill" id="calculation-fill"></div>
              <input type="range" min="0" max="10" value="1" step="0.5"
                     id="calculation-min" oninput="syncDualRange('calculation')"
                     data-db-bind="question.search.calcMin">
              <input type="range" min="0" max="10" value="7" step="0.5"
                     id="calculation-max" oninput="syncDualRange('calculation')"
                     data-db-bind="question.search.calcMax">
            </div>
            <div class="dual-labels">
              <span>最小值：<span id="calculation-min-label" data-db="question.search.calcMin">1</span></span>
              <span>最大值：<span id="calculation-max-label" data-db="question.search.calcMax">7</span></span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 题目列表标题栏 -->
    <div class="flex items-center justify-between" style="padding:12px 0 8px;">
      <span style="font-size:15px;font-weight:600;">题目列表（共 <span data-db="question.search.totalCount">10</span> 题）</span>
      <span class="selected-count" data-db="exam.build.selectedCount">已选 2 题</span>
    </div>

    <!-- 题目列表 -->
    <div data-db-loop="question.search">
      <div class="question-item">
        <div class="q-info">
          <div><strong data-db="question.search[].title">2025 东城一模 第 1 题</strong></div>
          <div class="text-secondary" data-db="question.search[].meta">难度 <span data-db="question.search[].difficulty">0.3</span> · 计算量 <span data-db="question.search[].calculation">1.2</span></div>
        </div>
        <button class="q-add selected" data-db-action="exam.toggleQuestion(1)">✓</button>
      </div>
      <div class="question-item">
        <div class="q-info">
          <div><strong data-db="question.search[].title">2025 东城一模 第 2 题</strong></div>
          <div class="text-secondary" data-db="question.search[].meta">难度 <span data-db="question.search[].difficulty">0.5</span> · 计算量 <span data-db="question.search[].calculation">1.8</span></div>
        </div>
        <button class="q-add selected" data-db-action="exam.toggleQuestion(2)">✓</button>
      </div>
      <div class="question-item">
        <div class="q-info">
          <div><strong data-db="question.search[].title">2025 东城一模 第 3 题</strong></div>
          <div class="text-secondary" data-db="question.search[].meta">难度 <span data-db="question.search[].difficulty">0.6</span> · 计算量 <span data-db="question.search[].calculation">2.5</span></div>
        </div>
        <button class="q-add" data-db-action="exam.toggleQuestion(3)">+</button>
      </div>
    </div>

    <!-- 确认组卷入口 -->
    <div style="margin-top:8px;">
      <a href="paper_quicklook.html" class="btn btn-primary btn-block">
        确认组卷
      </a>
    </div>
  </div>

  <script>
    function toggleFilter(header) {
      var section = header.parentElement;
      section.classList.toggle('open');
    }

    function syncDualRange(name) {
      var minInput = document.getElementById(name + '-min');
      var maxInput = document.getElementById(name + '-max');
      var minVal = parseFloat(minInput.value);
      var maxVal = parseFloat(maxInput.value);

      if (minVal > maxVal) {
        // 如果 min 超过 max，交换
        var tmp = minVal;
        minVal = maxVal;
        maxVal = tmp;
        minInput.value = minVal;
        maxInput.value = maxVal;
      }

      document.getElementById(name + '-min-label').textContent = minVal;
      document.getElementById(name + '-max-label').textContent = maxVal;

      // 更新填充条
      var totalMin = parseFloat(minInput.min);
      var totalMax = parseFloat(minInput.max);
      var range = totalMax - totalMin;
      var leftPct = ((minVal - totalMin) / range) * 100;
      var rightPct = ((maxVal - totalMin) / range) * 100;
      var fill = document.getElementById(name + '-fill');
      if (fill) {
        fill.style.left = leftPct + '%';
        fill.style.width = (rightPct - leftPct) + '%';
      }

      // 更新 data-db 占位显示
      var loopItems = document.querySelectorAll('[data-db="filter.' + name + '_min"]');
      loopItems.forEach(function(el) { el.textContent = minVal; });
      loopItems = document.querySelectorAll('[data-db="filter.' + name + '_max"]');
      loopItems.forEach(function(el) { el.textContent = maxVal; });
    }

    // 初始化所有双头滑块
    window.onload = function() {
      syncDualRange('difficulty');
      syncDualRange('calculation');
    };
  </script>
</body>
</html>
