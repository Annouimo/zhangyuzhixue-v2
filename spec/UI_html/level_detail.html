<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>等级详情 - 章鱼智学</title>
  <!-- 等级徽章和当前等级高亮使用 CSS 变量 --primary: #4A6CF7 -->
  <link rel="stylesheet" href="styles.css">
  <style>
    .level-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--primary);
      color: #fff;
      font-size: 28px;
      font-weight: 700;
      padding: 16px 32px;
      border-radius: 50px;
      margin-bottom: 12px;
    }
    .points-summary {
      display: flex;
      justify-content: space-around;
      text-align: center;
      margin: 16px 0;
    }
    .points-summary .item {
      flex: 1;
    }
    .points-summary .num {
      font-size: 22px;
      font-weight: 700;
      color: var(--primary);
    }
    .points-summary .label {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 2px;
    }
    .level-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    .level-table td {
      padding: 10px 8px;
      border-bottom: 1px solid var(--border);
    }
    .level-table .current {
      background: var(--primary-light);
      font-weight: 600;
      color: var(--primary);
    }
  </style>
</head>
<body>
  <div class="page-header">
    <a href="profile.html" class="back-btn">← 返回</a>
    <h1>等级详情</h1>
  </div>

  <div class="page" style="padding-top:8px;">
    <!-- 等级徽章 -->
    <div class="text-center" style="padding:20px 0;">
      <div class="level-badge">
        🏅 Lv.<span data-db="user.getInfo.level">5</span>
      </div>
      <div class="text-secondary" style="font-size:13px;">
        超过 <span data-db="user.getInfo.levelPercentile">75</span>% 的用户
      </div>
    </div>

    <!-- 三种积分概览 -->
    <div class="card">
      <div class="points-summary">
        <div class="item">
          <div class="num" data-db="user.getInfo.accumulatedPoints">22.0</div>
          <div class="label">累计积分</div>
        </div>
        <div class="item">
          <div class="num" data-db="user.getInfo.spentPoints">5.0</div>
          <div class="label">消耗积分</div>
        </div>
        <div class="item">
          <div class="num" data-db="user.getInfo.availablePoints">17.0</div>
          <div class="label">可用积分</div>
        </div>
      </div>
    </div>

    <!-- 等级对照表 -->
    <div class="card" style="padding:12px 16px;">
      <div style="font-size:14px;font-weight:600;">等级对照</div>
      <div class="text-secondary" style="font-size:12px;margin-top:2px;margin-bottom:8px;">等级依据累计积分计算</div>
      <table class="level-table" data-db-loop="points.getLevels">
        <tr>
          <td style="width:48px;font-weight:600;">Lv.1</td>
          <td>0 ~ 2</td>
        </tr>
        <tr>
          <td style="font-weight:600;">Lv.2</td>
          <td>3 ~ 5</td>
        </tr>
        <tr>
          <td style="font-weight:600;">Lv.3</td>
          <td>6 ~ 10</td>
        </tr>
        <tr>
          <td style="font-weight:600;">Lv.4</td>
          <td>11 ~ 16</td>
        </tr>
        <tr data-db="points.getLevels[4]" class="current">
          <td style="font-weight:700;">Lv.5</td>
          <td>17 ~ 24</td>
        </tr>
        <tr>
          <td style="font-weight:600;">Lv.6</td>
          <td>25 ~ 35</td>
        </tr>
        <tr>
          <td style="font-weight:600;">Lv.7</td>
          <td>36 ~ 50</td>
        </tr>
        <tr>
          <td style="font-weight:600;">Lv.8</td>
          <td>51 ~ 70</td>
        </tr>
        <tr>
          <td style="font-weight:600;">Lv.9</td>
          <td>71 ~ 100</td>
        </tr>
        <tr>
          <td style="font-weight:600;">Lv.10</td>
          <td>101 ~ 145</td>
        </tr>
        <tr style="color:var(--text-muted);font-size:13px;">
          <td colspan="2">更高等级待解锁...</td>
        </tr>
      </table>
    </div>
  </div>
</body>
</html>
