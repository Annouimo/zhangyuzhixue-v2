<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>关于 - 章鱼智学</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page-header">
    <a href="profile.html" class="back-btn">← 返回</a>
    <h1>关于</h1>
  </div>

  <div class="page" style="padding-top:8px;">
    <div class="card" style="text-align:center;padding:32px 20px;">
      <div style="font-size:64px;margin-bottom:12px;">🐙</div>
      <div style="font-size:22px;font-weight:700;margin-bottom:4px;">章鱼智学</div>
      <div class="text-secondary" style="font-size:13px;margin-bottom:24px;">
        北京高考数学 · 题库 · 讲义 · 解题训练
      </div>

      <div class="input-group">
        <label>软件版本</label>
        <div style="padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:15px;background:var(--bg);color:var(--text);" data-db="app.version">v1.2.0</div>
      </div>

      <div class="input-group">
        <label>题库版本</label>
        <div style="padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:15px;background:var(--bg);color:var(--text);" data-db="app.questionBankVersion">v3</div>
      </div>

      <div style="margin-top:20px;">
        <button class="btn btn-primary btn-block" onclick="location.href='https://appstore/download'">
          🔄 检查更新
        </button>
      </div>

      <div class="text-muted" style="font-size:11px;color:var(--text-muted);margin-top:24px;">
        © 2026 章鱼智学团队
      </div>
    </div>
  </div>
</body>
</html>
