<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>解题地图 - 章鱼智学</title>
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="solve.css">
</head>
<body>
  <div class="page-header">
    <a href="javascript:history.back()" class="back-btn">← 返回</a>
    <h1>解题地图</h1>
  </div>

  <div class="solve-container">
    <div class="question-meta">
      第 <span>3</span> 题　
      <span>导数第 1 讲课后练习</span>
      <span class="text-secondary">[解答]</span>
      <div class="attempt-selector" id="attempt-selector" style="display:none;">
        <div class="attempt-trigger" id="attempt-trigger" onclick="toggleAttemptDropdown()">
          <span id="attempt-label">第 1 次作答</span>
          <span class="arrow">▼</span>
        </div>
        <div class="attempt-dropdown" id="attempt-dropdown"></div>
      </div>
      <span class="attempt-badge" id="attempt-badge-single">第 1 次作答</span>
    </div>

    <div class="review-banner" id="review-banner" style="display:none;">
      📋 回顾模式 · 只读浏览，不可修改
    </div>

    <div id="map-fresh-view" style="display:none;">
      <div class="fresh-welcome">
        <div class="fresh-icon">📝</div>
        <div class="fresh-title">准备开始答题</div>
        <div class="fresh-desc">本题为解答题，共 2 小问，支持多种解法。<br>点击下方按钮开始你的首次作答。</div>
        <button class="btn btn-primary" onclick="startFirstStep()" style="margin-top:12px;">开始答题 ▶</button>
      </div>
    </div>

    <div id="map-tree"></div>

    <div class="map-footer">
      <button class="btn btn-outline" onclick="history.back()">← 返回</button>
      <button class="btn btn-outline" onclick="goRate()">⭐ 评分</button>
    </div>
  </div>

  <div class="toast-container"><div class="toast-bar" id="toast-bar"><span class="toast-icon" id="toast-icon"></span><span class="toast-msg" id="toast-msg"></span><button class="toast-close" onclick="closeToast()">✕</button></div></div>

  <script src="solve-utils.js"></script>
  <script>
  // =================================================================
  //  解题地图 — URL 参数: ?mode=first|resume|review&attempt_id=X
  // =================================================================

  var DEMO_ATTEMPTS = [
    { id:1, label:'第 1 次作答', completed:true, started:true,
      subQuestions:[
        { index:1, completed:true, statusLabel:'完全掌握',
          methods:[
            { name:'余弦定理法', allStepsDone:true,
              steps:[{order:1,title:'第 1 步 · 代值计算',state:'done'},{order:2,title:'第 2 步 · 化简',state:'done'},{order:3,title:'第 3 步 · 结论',state:'done'}] },
            { name:'向量法', allStepsDone:true,
              steps:[{order:1,title:'第 1 步 · 建系',state:'done'},{order:2,title:'第 2 步 · 推导',state:'done'}] }] },
        { index:2, completed:true, statusLabel:'已完成',
          methods:[{ name:'', allStepsDone:true,
            steps:[{order:1,title:'第 1 步 · 代入',state:'done'},{order:2,title:'第 2 步 · 结论',state:'done'}] }] }] },
    { id:2, label:'第 2 次作答', completed:true, started:true,
      subQuestions:[
        { index:1, completed:true, statusLabel:'已完成',
          methods:[
            { name:'余弦定理法', allStepsDone:true,
              steps:[{order:1,title:'第 1 步 · 代值计算',state:'done'},{order:2,title:'第 2 步 · 化简',state:'done'},{order:3,title:'第 3 步 · 结论',state:'done'}] },
            { name:'向量法', allStepsDone:false,
              steps:[{order:1,title:'第 1 步 · 建系',state:'done'},{order:2,title:'第 2 步 · 推导',state:'untried'}] }] },
        { index:2, completed:false, statusLabel:'进行中...',
          methods:[{ name:'', allStepsDone:false,
            steps:[{order:1,title:'第 1 步 · 代入',state:'done'},{order:2,title:'第 2 步 · 结论',state:'in-progress'}] }] }] },
    { id:3, label:'第 3 次作答', completed:false, started:true,
      subQuestions:[
        { index:1, completed:false, statusLabel:'进行中...',
          methods:[
            { name:'余弦定理法', allStepsDone:false,
              steps:[{order:1,title:'第 1 步 · 代值计算',state:'done'},{order:2,title:'第 2 步 · 化简',state:'in-progress'},{order:3,title:'第 3 步 · 结论',state:'locked'}] },
            { name:'向量法', allStepsDone:false,
              steps:[{order:1,title:'第 1 步 · 建系',state:'untried'},{order:2,title:'第 2 步 · 推导',state:'locked'}] }] },
        { index:2, completed:false, statusLabel:'🔒 未解锁',
          methods:[{ name:'', allStepsDone:false,
            steps:[{order:1,title:'第 1 步 · 代入',state:'locked'},{order:2,title:'第 2 步 · 结论',state:'locked'}] }] }] },
    { id:4, label:'第 4 次作答', completed:false, started:false,
      subQuestions:[
        { index:1, completed:false, statusLabel:'待开始',
          methods:[
            { name:'余弦定理法', allStepsDone:false, steps:[{order:1,title:'',state:'untried'},{order:2,title:'',state:'locked'},{order:3,title:'',state:'locked'}] },
            { name:'向量法', allStepsDone:false, steps:[{order:1,title:'',state:'untried'},{order:2,title:'',state:'locked'}] }] },
        { index:2, completed:false, statusLabel:'🔒',
          methods:[{ name:'', allStepsDone:false, steps:[{order:1,title:'',state:'locked'},{order:2,title:'',state:'locked'}] }] }] }
  ];

  var _currentAttemptId = null;

  function getUrlParams() {
    var p = {};
    location.search.replace(/[?&]([^=]+)=([^&]*)/g, function(_, k, v) { p[k] = decodeURIComponent(v); });
    return p;
  }

  function initFromUrl() {
    var p = getUrlParams();
    var mode = p.mode || 'first';
    var id = p.attempt_id ? parseInt(p.attempt_id) : null;
    if (mode === 'first') {
      var fresh = DEMO_ATTEMPTS.find(function(a) { return !a.started; });
      if (fresh) _currentAttemptId = fresh.id;
      else { createFreshAttempt(); }
    } else if (id && DEMO_ATTEMPTS.find(function(a) { return a.id === id; })) {
      _currentAttemptId = id;
    } else {
      _currentAttemptId = DEMO_ATTEMPTS[DEMO_ATTEMPTS.length - 1].id;
    }
  }

  function createFreshAttempt() {
    var newId = DEMO_ATTEMPTS.length + 1;
    DEMO_ATTEMPTS.push({
      id:newId, label:'第 '+newId+' 次作答', completed:false, started:false,
      subQuestions:[
        { index:1, completed:false, statusLabel:'待开始',
          methods:[
            { name:'余弦定理法', allStepsDone:false, steps:[{order:1,title:'',state:'untried'},{order:2,title:'',state:'locked'},{order:3,title:'',state:'locked'}] },
            { name:'向量法', allStepsDone:false, steps:[{order:1,title:'',state:'untried'},{order:2,title:'',state:'locked'}] }] },
        { index:2, completed:false, statusLabel:'🔒',
          methods:[{ name:'', allStepsDone:false, steps:[{order:1,title:'',state:'locked'},{order:2,title:'',state:'locked'}] }] }]
    });
    _currentAttemptId = newId;
  }

  function isFreshAttempt(att) { return !att.started; }

  function renderMap() {
    var att = DEMO_ATTEMPTS.find(function(a) { return a.id === _currentAttemptId; });
    if (!att) return;

    var isSingle = DEMO_ATTEMPTS.length <= 1;
    document.getElementById('attempt-selector').style.display = isSingle ? 'none' : 'inline-block';
    document.getElementById('attempt-badge-single').style.display = isSingle ? 'inline' : 'none';
    document.getElementById('attempt-badge-single').textContent = att.label;
    document.getElementById('attempt-label').textContent = att.label;

    var banner = document.getElementById('review-banner');
    var lastStarted = DEMO_ATTEMPTS.filter(function(a){return a.started;}).slice(-1)[0];
    banner.style.display = (att.completed && lastStarted && att.id !== lastStarted.id) ? 'block' : 'none';

    renderDropdown(att.id);

    var fresh = isFreshAttempt(att);
    document.getElementById('map-tree').style.display = fresh ? 'none' : 'block';
    document.getElementById('map-fresh-view').style.display = fresh ? 'block' : 'none';
    if (!fresh) renderTree(att);
  }

  function renderDropdown(activeId) {
    var dd = document.getElementById('attempt-dropdown'); dd.innerHTML = '';
    DEMO_ATTEMPTS.forEach(function(a) {
      var opt = document.createElement('div');
      opt.className = 'attempt-option' + (a.id === activeId ? ' active' : '');
      var l = document.createElement('span'); l.textContent = a.label; opt.appendChild(l);
      var s = document.createElement('span');
      if (a.completed) { s.className='opt-status review'; s.textContent='回顾'; }
      else if (a.started) { s.className='opt-status'; s.textContent = a.id===activeId?'当前':'进行中'; }
      else { s.className='opt-status'; s.textContent='未开始'; }
      opt.appendChild(s);
      opt.onclick = function() { switchAttempt(a.id); };
      dd.appendChild(opt);
    });
    var div = document.createElement('div'); div.className='attempt-divider'; dd.appendChild(div);
    var n = document.createElement('div'); n.className='attempt-option';
    var nl = document.createElement('span'); nl.textContent='重新作答'; n.appendChild(nl);
    var ns = document.createElement('span'); ns.className='opt-status'; ns.textContent='新存档'; n.appendChild(ns);
    n.onclick = function() { createNewAttempt(); }; dd.appendChild(n);
  }

  function renderTree(att) {
    var container = document.getElementById('map-tree'); container.innerHTML = '';
    att.subQuestions.forEach(function(sq) {
      var section = document.createElement('div'); section.className = 'subq-section';
      var hdr = document.createElement('div'); hdr.className = 'subq-header';
      if (sq.completed) hdr.classList.add('completed');
      else if (sq.methods.some(function(m){return m.steps.some(function(s){return s.state==='in-progress'||s.state==='done';});})) hdr.classList.add('active');
      else hdr.classList.add('locked');
      var t = document.createElement('span'); t.textContent = sq.index===1?'(1) 求 cos C 的值':'(2) 若 c = 3，求 a + b 的最大值'; hdr.appendChild(t);
      var st = document.createElement('span'); st.className = 'subq-status';
      if (sq.statusLabel.indexOf('完全掌握')>=0) st.classList.add('mastered');
      else if (sq.completed) st.classList.add('done');
      st.textContent = sq.statusLabel; hdr.appendChild(st); section.appendChild(hdr);
      sq.methods.forEach(function(m) {
        var mr = document.createElement('div'); mr.className = 'method-row';
        var mh = document.createElement('div'); mh.className = 'method-header';
        mh.onclick = function(){var l=mh.nextElementSibling;if(l)l.style.display=l.style.display==='none'?'block':'none';};
        var mn = document.createElement('span'); mn.className='method-name'; mn.textContent=m.name?'📐 '+m.name:'唯一解法'; mh.appendChild(mn);
        var ms = document.createElement('span'); ms.className='method-status';
        ms.textContent = m.steps.filter(function(s){return s.state==='done';}).length+'/'+m.steps.length+' 步'; mh.appendChild(ms); mr.appendChild(mh);
        var sl = document.createElement('ul'); sl.className='step-list';
        m.steps.forEach(function(s) {
          var li = document.createElement('li');
          var sn = document.createElement('a'); sn.className='step-node'; sn.href='solve-step.html';
          var dot = document.createElement('span'); dot.className='step-dot '+s.state;
          if (s.state==='done') dot.textContent='✓'; else if (s.state==='in-progress') dot.textContent=s.order; else if (s.state==='locked') dot.textContent='🔒'; else dot.textContent=s.order;
          sn.appendChild(dot);
          var sti = document.createElement('span'); sti.className='step-title'; sti.textContent=s.title||'第 '+s.order+' 步'; sn.appendChild(sti);
          var arr = document.createElement('span'); arr.className='step-arrow'; arr.textContent='→'; sn.appendChild(arr);
          if (s.state!=='locked') { sn.onclick=function(){goStep(sq.index,m.name,s.order);return false;}; }
          else { sn.style.cursor='default'; sn.onclick=function(){return false;}; }
          li.appendChild(sn); sl.appendChild(li);
        });
        mr.appendChild(sl); section.appendChild(mr);
      });
      container.appendChild(section);
    });
  }

  function startFirstStep() {
    var att = DEMO_ATTEMPTS.find(function(a){return a.id===_currentAttemptId;}); if (!att) return;
    att.started = true;
    att.subQuestions[0].statusLabel = '进行中...';
    att.subQuestions[0].methods[0].steps[0].state = 'in-progress';
    renderMap();
    goStep(1, att.subQuestions[0].methods[0].name||'', 1);
  }

  function switchAttempt(id) {
    if (id===_currentAttemptId) { closeDropdown(); return; }
    _currentAttemptId = id; closeDropdown(); renderMap();
    var a = DEMO_ATTEMPTS.find(function(x){return x.id===id;});
    if (a.completed) showToast('📋', a.label+' · 回顾模式');
  }

  function createNewAttempt() {
    closeDropdown(); createFreshAttempt();
    renderMap(); showToast('🆕', '已创建全新未开始');
  }

  function toggleAttemptDropdown() {
    var dd=document.getElementById('attempt-dropdown'),tr=document.getElementById('attempt-trigger');
    dd.classList.toggle('show'); tr.classList.toggle('open');
    if (dd.classList.contains('show')) renderDropdown(_currentAttemptId);
  }
  function closeDropdown() {
    document.getElementById('attempt-dropdown').classList.remove('show');
    document.getElementById('attempt-trigger').classList.remove('open');
  }
  document.addEventListener('click',function(e){var s=document.getElementById('attempt-selector');if(s&&!s.contains(e.target))closeDropdown();});

  var _stemExpanded = true;
  function toggleStem() { _stemExpanded=!_stemExpanded; document.getElementById('stem-body').style.display=_stemExpanded?'block':'none'; }

  function goStep(subq,method,stepOrder) {
    var qtype = '解答';
    parent.goFile('solve-step.html');
  }

  function goRate() { parent.goFile('solve-rate.html'); }

  document.addEventListener('DOMContentLoaded', function() { initFromUrl(); renderMap(); });
  </script>
</body>
</html>
