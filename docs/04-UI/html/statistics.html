<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学习统计 - 章鱼智学</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .stat-summary { display: flex; justify-content: space-around; text-align: center; padding: 8px 0; }
    .stat-summary .item { flex: 1; }
    .stat-summary .num { font-size: 22px; font-weight: 700; color: var(--primary); }
    .stat-summary .label { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
    .chart-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 12px; }
    .chart-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .chart-header .chart-title { font-size: 14px; font-weight: 600; }

    .daily-chart > div { display: none; }
    .daily-chart.show-bar > .dm-bar { display: block; }
    .daily-chart.show-cal > .dm-cal { display: block; }
    .daily-chart.show-week > .dm-week { display: block; }
    .daily-chart.show-month > .dm-month { display: block; }
    .daily-chart .mode-hint { font-size: 10px; color: var(--text-muted); margin-bottom: 8px; }

    /* 模式A：水平条形图 */
    .bar-list { font-size: 12px; }
    .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .bar-row .bdate { width: 36px; flex-shrink: 0; color: var(--text-secondary); font-size: 11px; }
    .bar-row .btrack { flex: 1; height: 20px; border-radius: 4px; overflow: hidden; }
    .bar-row .btrack .bfill { height: 100%; border-radius: 4px; min-width: 4px; }
    .bar-row .btrack .bfill.lv0 { background: transparent; }
    .bar-row .btrack .bfill.lv1 { background: #DBEAFE; }
    .bar-row .btrack .bfill.lv2 { background: #60A5FA; }
    .bar-row .btrack .bfill.lv3 { background: var(--primary); }
    .bar-row .bval { width: 24px; text-align: right; color: var(--text-muted); font-size: 11px; }

    /* 模式B：7行周历（flex 列布局） */
    .cal-wrap { overflow-x: auto; }
    .cal-flex { display: flex; gap: 2px; }
    .cal-flex .col { display: flex; flex-direction: column; gap: 2px; }
    .cal-flex .col-lbl { display: flex; flex-direction: column; gap: 2px; width: 22px; }
    .cal-flex .ch { font-size: 7px; color: var(--text-muted); height: 12px; line-height: 12px; text-align: center; }
    .cal-flex .cr { width: 12px; height: 12px; border-radius: 2px; }
    .cal-flex .clbl { width: 22px; height: 12px; line-height: 12px; font-size: 8px; color: var(--text-muted); text-align: right; padding-right: 2px; }
    .cal-flex .cr.lv0 { background: var(--border); }
    .cal-flex .cr.lv1 { background: #DBEAFE; }
    .cal-flex .cr.lv2 { background: #60A5FA; }
    .cal-flex .cr.lv3 { background: var(--primary); }

    /* 模式C：周格 */
    .week-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(28px, 1fr)); gap: 4px; }
    .week-grid .wc { text-align: center; padding: 6px 2px; border-radius: var(--radius-sm); font-size: 10px; position: relative; }
    .week-grid .wc .wd { font-size: 8px; opacity: 0.6; margin-top: 2px; }
    .week-grid .wc.lv0 { background: var(--border); color: var(--text-muted); }
    .week-grid .wc.lv1 { background: #DBEAFE; }
    .week-grid .wc.lv2 { background: #60A5FA; color: #fff; }
    .week-grid .wc.lv3 { background: var(--primary); color: #fff; font-weight: 600; }

    /* 模式D：月格 */
    .month-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); gap: 6px; font-size: 12px; }
    .month-grid .mc { text-align: center; padding: 8px 4px; border-radius: var(--radius-sm); }
    .month-grid .mc.lv0 { background: var(--border); color: var(--text-muted); }
    .month-grid .mc.lv1 { background: #DBEAFE; }
    .month-grid .mc.lv2 { background: #60A5FA; color: #fff; }
    .month-grid .mc.lv3 { background: var(--primary); color: #fff; font-weight: 600; }
    .month-grid .mc .ml { font-size: 10px; margin-top: 2px; opacity: 0.8; }

    .legend-row { display: flex; align-items: center; gap: 6px; padding: 8px 0 0 0; font-size: 11px; color: var(--text-muted); }
    .legend-row .swatch { width: 14px; height: 14px; border-radius: 3px; }

    .chart-area { display: flex; gap: 6px; margin-top: 8px; }
    .chart-yaxis { display: flex; flex-direction: column; justify-content: space-between; align-items: flex-end; padding-right: 4px; font-size: 10px; color: var(--text-muted); width: 32px; flex-shrink: 0; }
    .chart-body { flex: 1; position: relative; overflow: hidden; }
    .chart-grid { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; }
    .chart-grid .gl { border-bottom: 1px solid var(--border); height: 0; }
    .line-chart-wrap { position: relative; height: 120px; z-index: 1; }
    .line-chart-wrap svg { width: 100%; height: 100%; display: block; }
    .chart-xaxis { display: flex; justify-content: space-between; padding: 4px 0 0 38px; font-size: 9px; color: var(--text-muted); }
    .stat-row { display: flex; align-items: center; justify-content: space-between; padding: 4px 0; font-size: 13px; }
    .stat-row .stat-label { color: var(--text-secondary); }
    .stat-row .stat-value { font-weight: 600; }
    .donut-area { display: flex; align-items: center; justify-content: center; gap: 20px; padding: 12px 0; }
    .donut-area .ring { width: 80px; height: 80px; border-radius: 50%; position: relative; }
    .donut-area .ring .inner { position: absolute; top: 12px; left: 12px; width: 56px; height: 56px; background: var(--card); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: var(--primary); }
    .donut-legend { font-size: 12px; }
    .donut-legend .leg-item { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
    .donut-legend .leg-dot { width: 10px; height: 10px; border-radius: 50%; }
    body { padding-bottom: 24px; }
  </style>
</head>
<body>
  <div class="page-header">
    <a href="javascript:history.back()" class="back-btn">← 返回</a>
    <h1>学习统计</h1>
  </div>

  <div class="page" style="padding-top:8px;">
    <!-- 调试区 (dev only) -->
    <div class="card" style="margin-bottom:12px;border:1px dashed var(--text-muted);opacity:0.6;">
      <div style="font-size:12px;color:var(--text-muted);margin-bottom:8px;">⚙️ 调试：强制切换做题热力图模式</div>
      <p style="font-size:11px;color:var(--text-muted);margin-bottom:8px;line-height:1.5;">
        当前数据范围自动决定展示方式：短时段→条形图，15~90天→7行周历，91~730天→周格，大于730天→月格<br>
        <strong>正式版此区域删除</strong>
      </p>
      <div class="flex gap-2">
        <button class="btn btn-sm btn-outline" onclick="forceMode('show-bar')">条形图</button>
        <button class="btn btn-sm btn-outline" onclick="forceMode('show-cal')">7行周历</button>
        <button class="btn btn-sm btn-outline" onclick="forceMode('show-week')">周格</button>
        <button class="btn btn-sm btn-outline" onclick="forceMode('show-month')">月格</button>
      </div>
    </div>

    <!-- 时间范围 -->
    <div class="sort-bar" style="margin-bottom:0;">
      <span class="sort-pill active" onclick="selectRange(this,7)">近一周</span>
      <span class="sort-pill" onclick="selectRange(this,30)">近一月</span>
      <span class="sort-pill" onclick="selectRange(this,90)">近三月</span>
      <span class="sort-pill" onclick="selectRange(this,365)">近一年</span>
      <span class="sort-pill" onclick="selectRange(this,0)">全部</span>
    </div>
    <span id="total-days" style="display:none;">60</span>

    <!-- 概览 -->
    <div class="card" style="margin-top:12px;">
      <div class="stat-summary" id="stat-summary">
        <div class="item"><div class="num" id="stat-total" data-db="stats.getOverview.totalQuestions">—</div><div class="label">总做题</div></div>
        <div class="item"><div class="num" id="stat-acc" data-db="stats.getOverview.accuracyPercent">—</div><div class="label">正确率</div></div>
        <div class="item"><div class="num" id="stat-streak" data-db="stats.getOverview.streakDays">—</div><div class="label">连续做题天</div></div>
        <div class="item"><div class="num" id="stat-active" data-db="stats.getOverview.activeDays">—</div><div class="label">活跃天</div></div>
      </div>
    </div>

    <!-- 做题热力图 -->
    <div class="chart-card">
      <div class="chart-header">
        <div class="chart-title">做题热力图</div>
        <span class="text-secondary" style="font-size:11px;" id="daily-hint">—</span>
      </div>
      <div class="daily-chart show-bar" id="daily-chart">
        <div class="dm-bar" id="dm-bar"><div class="bar-list" data-db-loop="stats.getDailyRecords"></div></div>
        <div class="dm-cal" id="dm-cal">
          <div class="mode-hint">每格=1天 · 列头日期为该周周一</div>
          <div class="cal-wrap" data-db-loop="stats.getDailyRecords"><div class="cal-flex"></div></div>
        </div>
        <div class="dm-week" id="dm-week">
          <div class="mode-hint">每格=1周 · 下方为月份</div>
          <div class="week-grid" data-db-loop="stats.getDailyRecords"></div>
        </div>
        <div class="dm-month" id="dm-month">
          <div class="mode-hint">每格=1月</div>
          <div class="month-grid" data-db-loop="stats.getDailyRecords"></div>
        </div>
      </div>
      <div class="legend-row">
        <span>少</span>
        <span class="swatch" style="background:var(--border);"></span>
        <span class="swatch" style="background:#DBEAFE;"></span>
        <span class="swatch" style="background:#60A5FA;"></span>
        <span class="swatch" style="background:var(--primary);"></span>
        <span>多</span>
      </div>
    </div>

    <!-- 正确率趋势 -->
    <div class="chart-card">
      <div class="chart-header"><div class="chart-title">正确率趋势</div><span class="text-secondary" style="font-size:11px;" id="acc-label">—</span></div>
      <div class="chart-area" data-db-loop="stats.getAccuracyTrend">
        <div class="chart-yaxis"><span>100%</span><span>75%</span><span>50%</span><span>25%</span><span>0%</span></div>
        <div class="chart-body">
          <div class="chart-grid"><div class="gl"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div></div>
          <div class="line-chart-wrap"><svg viewBox="0 0 300 120" preserveAspectRatio="none" id="acc-svg"></svg></div>
        </div>
      </div>
      <div class="chart-xaxis" id="acc-xaxis"></div>
      <div class="stat-row" style="margin-top:4px;"><span class="stat-label">该时段正确率</span><span class="stat-value" style="color:var(--success);" id="acc-val">—</span></div>
    </div>

    <!-- 积分累计趋势 -->
    <div class="chart-card">
      <div class="chart-header"><div class="chart-title">积分累计趋势</div><span class="text-secondary" style="font-size:11px;" id="points-label">—</span></div>
      <div class="chart-area" data-db-loop="stats.getPointsTrend">
        <div class="chart-yaxis"><span id="points-y-max">—</span><span>—</span><span>—</span><span>—</span><span>0</span></div>
        <div class="chart-body">
          <div class="chart-grid"><div class="gl"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div></div>
          <div class="line-chart-wrap"><svg viewBox="0 0 300 120" preserveAspectRatio="none" id="points-svg"></svg></div>
        </div>
      </div>
      <div class="chart-xaxis" id="points-xaxis"></div>
      <div class="stat-row" style="margin-top:4px;"><span class="stat-label">时段累计积分</span><span class="stat-value" id="points-val">—</span></div>
    </div>

    <!-- 题型分布 -->
    <div class="chart-card">
      <div class="chart-header"><div class="chart-title">题型分布</div><span class="text-secondary" style="font-size:11px;" id="dist-label">—</span></div>
      <div class="donut-area">
        <div class="ring" id="donut-ring" style="background: conic-gradient(var(--border) 0deg 360deg);"><div class="inner" id="donut-inner" data-db="stats.getDistribution.total">0题</div></div>
        <div class="donut-legend" id="donut-legend">
          <div class="leg-item"><span class="leg-dot" style="background:var(--primary);"></span><span>选择题 <span id="dist-choice" data-db="stats.getDistribution.choiceCount">—</span>（<span id="dist-choice-p" data-db="stats.getDistribution.choicePercent">—</span>%）</span></div>
          <div class="leg-item"><span class="leg-dot" style="background:#10B981;"></span><span>填空题 <span id="dist-fill" data-db="stats.getDistribution.fillCount">—</span>（<span id="dist-fill-p" data-db="stats.getDistribution.fillPercent">—</span>%）</span></div>
          <div class="leg-item"><span class="leg-dot" style="background:#F59E0B;"></span><span>解答题 <span id="dist-sol" data-db="stats.getDistribution.solutionCount">—</span>（<span id="dist-sol-p" data-db="stats.getDistribution.solutionPercent">—</span>%）</span></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ---- 可预测的伪随机 ----
    function sr(seed) { var x = Math.sin(seed) * 10000; return x - Math.floor(x); }

    // ---- 日期工具 ----
    function fmtDate(d) { return (d.getMonth()+1)+'/'+d.getDate(); }
    function fmtMonth(d) { return (d.getMonth()+1)+'月'; }
    function addDays(d, n) { var r = new Date(d); r.setDate(r.getDate()+n); return r; }
    function getMonday(d) { var cd = new Date(d); var day = cd.getDay(); cd.setDate(cd.getDate()-(day===0?6:day-1)); return cd; }
    function dateStr(d) { return d.getFullYear()+'-'+d.getDate()+'-'+(d.getMonth()+1); }

    // ---- 生成演示数据 ----
    function generateData(numDays) {
      var today = new Date(); today.setHours(0,0,0,0);
      var data = [];
      for (var i = 0; i < numDays; i++) {
        var d = addDays(today, -(numDays-1-i));
        var wd = d.getDay();
        var base = (wd===0||wd===6) ? 2 : 4;
        var count = Math.floor(sr(i*13+7)*(base+5));
        if (count>12) count=12;
        var correct = Math.floor(count*(0.55+sr(i*17+3)*0.35));
        data.push({ date:d, count:count, correct:correct, wd:wd });
      }
      return data;
    }

    // ---- level 0~3 根据档位 ----
    function levelOf(v, max) {
      if (max===0) return 0;
      var r = v/max;
      if (r===0) return 0;
      if (r<=0.33) return 1;
      if (r<=0.66) return 2;
      return 3;
    }

    // ---- 渲染概览 ----
    function renderSummary(data) {
      var total = 0, correct = 0, active = 0, streak = 0, curStreak = 0;
      for (var i=0;i<data.length;i++) {
        total += data[i].count;
        correct += data[i].correct;
        if (data[i].count>0) { active++; curStreak++; } else curStreak=0;
      }
      streak = curStreak;
      document.getElementById('stat-total').textContent = total;
      document.getElementById('stat-acc').textContent = total===0?'—':Math.round(correct/total*100)+'%';
      document.getElementById('stat-streak').textContent = streak;
      document.getElementById('stat-active').textContent = active;
      return {total:total, correct:correct, active:active, streak:streak};
    }

    // ---- 渲染条形图（模式A） ----
    function renderBar(data) {
      var show = data.length > 14 ? data.slice(-14) : data;
      var max = 0;
      for (var i=0;i<show.length;i++) if (show[i].count>max) max=show[i].count;
      var html = '';
      for (var i=0;i<show.length;i++) {
        var pct = max===0?0:Math.round(show[i].count/max*100);
        var lv = levelOf(show[i].count, max);
        html += '<div class="bar-row"><span class="bdate">'+fmtDate(show[i].date)+'</span>'
          +'<div class="btrack"><div class="bfill lv'+lv+'" style="width:'+pct+'%"></div></div>'
          +'<span class="bval">'+show[i].count+'</span></div>';
      }
      document.querySelector('#dm-bar .bar-list').innerHTML = html;
    }

    // ---- 渲染7行周历（模式B） ----
    function renderCal(data) {
      if (data.length===0) return;
      var first = data[0].date, last = data[data.length-1].date;
      var monday = getMonday(first);
      var dMap = {};
      for (var i=0;i<data.length;i++) dMap[dateStr(data[i].date)]=data[i];
      var cols = [];
      var w = new Date(monday);
      while (w<=last||(w>last&&w.getDay()!==1)) {
        cols.push(new Date(w));
        w = addDays(w, 7);
      }
      var maxVal = 0;
      for (var i=0;i<data.length;i++) if (data[i].count>maxVal) maxVal=data[i].count;

      var html = '<div class="col-lbl"><div class="ch"></div>'
        +'<div class="clbl">一</div><div class="clbl">二</div><div class="clbl">三</div>'
        +'<div class="clbl">四</div><div class="clbl">五</div><div class="clbl">六</div><div class="clbl">日</div></div>';
      for (var ci=0;ci<cols.length;ci++) {
        var col = cols[ci];
        html += '<div class="col"><div class="ch">'+fmtDate(col)+'</div>';
        for (var wd=1;wd<=7;wd++) {
          var d = new Date(col); d.setDate(d.getDate()+(wd-1));
          var key = dateStr(d);
          var val = dMap[key]?dMap[key].count:0;
          var lv = levelOf(val, maxVal);
          html += '<div class="cr lv'+lv+'"></div>';
        }
        html += '</div>';
      }
      document.querySelector('#dm-cal .cal-flex').innerHTML = html;
    }

    // ---- 渲染周格（模式C） ----
    function renderWeek(data) {
      if (data.length===0) return;
      var weeks = [];
      var wStart = getMonday(data[0].date);
      var curW = new Date(wStart);
      var i=0;
      while (i<data.length || addDays(curW,6)<=data[data.length-1].date) {
        var sum=0, monthLabel='';
        var wEnd = addDays(curW,6);
        while (i<data.length && data[i].date<=wEnd) {
          if (data[i].count>0) { sum+=data[i].count; if (!monthLabel) monthLabel=fmtMonth(data[i].date); }
          i++;
        }
        weeks.push({sum:sum, label:monthLabel});
        curW = addDays(curW, 7);
        if (i>=data.length && curW>data[data.length-1].date) break;
      }
      var maxSum=0;
      for (var wi=0;wi<weeks.length;wi++) if (weeks[wi].sum>maxSum) maxSum=weeks[wi].sum;
      var html='';
      for (var wi=0;wi<weeks.length;wi++) {
        var lv = levelOf(weeks[wi].sum, maxSum);
        html += '<div class="wc lv'+lv+'"><span>'+weeks[wi].sum+'</span>'
          +(weeks[wi].label?'<div class="wd">'+weeks[wi].label+'</div>':'')+'</div>';
      }
      document.querySelector('#dm-week .week-grid').innerHTML = html;
    }

    // ---- 渲染月格（模式D） ----
    function renderMonth(data) {
      if (data.length===0) return;
      var months = [];
      var curM = new Date(data[0].date); curM.setDate(1);
      var i=0;
      while (i<data.length) {
        var sum=0;
        var mStart = new Date(curM);
        var mEnd = new Date(curM); mEnd.setMonth(mEnd.getMonth()+1); mEnd.setDate(0);
        while (i<data.length && data[i].date<=mEnd) { if (data[i].count>0) sum+=data[i].count; i++; }
        months.push({sum:sum, label:fmtMonth(mStart)});
        curM.setMonth(curM.getMonth()+1);
        if (i>=data.length) break;
      }
      var maxSum=0;
      for (var mi=0;mi<months.length;mi++) if (months[mi].sum>maxSum) maxSum=months[mi].sum;
      var html='';
      for (var mi=0;mi<months.length;mi++) {
        var lv = levelOf(months[mi].sum, maxSum);
        html += '<div class="mc lv'+lv+'"><span>'+months[mi].sum+'</span><div class="ml">'+months[mi].label+'</div></div>';
      }
      document.querySelector('#dm-month .month-grid').innerHTML = html;
    }

    // ---- 渲染正确率趋势图 ----
    function renderAccTrend(data) {
      var N = data.length;
      if (N===0) return;
      var step = N>30 ? Math.ceil(N/30) : 1;
      var pts = [];
      for (var i=0;i<N;i+=step) {
        var slice = data.slice(i, Math.min(i+step, N));
        var sum=0, corr=0;
        for (var si=0;si<slice.length;si++) { sum+=slice[si].count; corr+=slice[si].correct; }
        var acc = sum===0?0.5:corr/sum;
        pts.push({date:slice[Math.floor(slice.length/2)].date, acc:acc, idx:i});
      }
      var lastSlice = data.slice(Math.max(0,N-step),N);
      var lSum=0,lCorr=0;
      for (var si=0;si<lastSlice.length;si++) { lSum+=lastSlice[si].count; lCorr+=lastSlice[si].correct; }
      var lastAcc = lSum===0?0.5:lCorr/lSum;
      if (pts.length===0 || pts[pts.length-1].idx!==N-1) pts.push({date:data[N-1].date, acc:lastAcc, idx:N-1});

      var w=300, h=120, padL=15, padR=15;
      var drawW = w-padL-padR;
      var polyline='', circles='';
      for (var pi=0;pi<pts.length;pi++) {
        var x = Math.round(padL + (pts.length>1?pi/(pts.length-1):0.5)*drawW);
        var y = Math.round(h - pts[pi].acc*h);
        if (y<2) y=2; if (y>h-2) y=h-2;
        polyline += (pi>0?' ':'')+x+','+y;
        circles += '<circle cx="'+x+'" cy="'+y+'" r="3.5" fill="'+(pts[pi].acc>=0.5?'var(--success)':'var(--warning)')+'"/>';
      }
      document.getElementById('acc-svg').innerHTML =
        '<polyline points="'+polyline+'" fill="none" stroke="var(--success)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+circles;
      var xLabels = [pts[0], pts[Math.floor(pts.length/2)], pts[pts.length-1]];
      document.getElementById('acc-xaxis').innerHTML =
        xLabels.map(function(p){return '<span>'+fmtDate(p.date)+'</span>';}).join('');
      var tSum=0,tCorr=0;
      for (var i=0;i<N;i++) { tSum+=data[i].count; tCorr+=data[i].correct; }
      document.getElementById('acc-val').textContent = tSum===0?'—':Math.round(tCorr/tSum*100)+'%';
    }

    // ---- 渲染积分累计趋势 ----
    function renderPointsTrend(data) {
      var N = data.length;
      if (N===0) return;
      var cum = 0, cumArr = [];
      for (var i=0;i<N;i++) { cum += data[i].count*0.5 + data[i].correct*0.3; cumArr.push(Math.round(cum*10)/10); }
      var maxPts = cum;
      var step = N>30 ? Math.ceil(N/30) : 1;
      var pts = [];
      for (var i=0;i<N;i+=step) { pts.push({date:data[i].date, val:cumArr[i], idx:i}); }
      if (pts.length===0 || pts[pts.length-1].idx!==N-1) pts.push({date:data[N-1].date, val:cumArr[N-1], idx:N-1});
      var w=300, h=120, padL=15, padR=15, drawW=w-padL-padR, poly='', cir='';
      for (var pi=0;pi<pts.length;pi++) {
        var x = Math.round(padL+(pts.length>1?pi/(pts.length-1):0.5)*drawW);
        var y = maxPts===0?h:Math.round(h - pts[pi].val/maxPts*(h-8) - 4);
        if (y<0) y=0; if (y>h) y=h;
        poly += (pi>0?' ':'')+x+','+y;
        cir += '<circle cx="'+x+'" cy="'+y+'" r="3.5" fill="var(--primary)"/>';
      }
      document.getElementById('points-svg').innerHTML =
        '<polyline points="'+poly+'" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+cir;
      var stepY = maxPts/4;
      var yVals = [];
      for (var yi=4;yi>=1;yi--) yVals.push(Math.round(yi*stepY*10)/10);
      var ySpans = document.querySelectorAll('.chart-yaxis')[1].querySelectorAll('span');
      for (var yi=0;yi<4&&yi<ySpans.length;yi++) ySpans[yi].textContent = yVals[yi];
      document.getElementById('points-y-max').textContent = yVals[0];
      var xl = [pts[0], pts[Math.floor(pts.length/2)], pts[pts.length-1]];
      document.getElementById('points-xaxis').innerHTML = xl.map(function(p){return '<span>'+fmtDate(p.date)+'</span>';}).join('');
      document.getElementById('points-val').textContent = cumArr[N-1].toFixed(1);
    }

    // ---- 渲染题型分布 ----
    function renderDistribution(data, summary) {
      var total = summary.total;
      if (total===0) {
        document.getElementById('donut-ring').style.background='conic-gradient(var(--border) 0deg 360deg)';
        document.getElementById('donut-inner').textContent='0题';
        document.getElementById('dist-choice').textContent='—'; document.getElementById('dist-choice-p').textContent='—';
        document.getElementById('dist-fill').textContent='—'; document.getElementById('dist-fill-p').textContent='—';
        document.getElementById('dist-sol').textContent='—'; document.getElementById('dist-sol-p').textContent='—';
        return;
      }
      var srSeed = total*7+3;
      var choiceR = 0.4 + sr(srSeed)*0.1;
      var fillR = 0.15 + sr(srSeed+5)*0.1;
      var solR = 1 - choiceR - fillR;
      var choice = Math.round(total*choiceR);
      var fill = Math.round(total*fillR);
      var sol = total - choice - fill;
      var choiceDeg = Math.round(choice/total*360);
      var fillDeg = Math.round(fill/total*360);
      var solDeg = 360 - choiceDeg - fillDeg;
      document.getElementById('donut-ring').style.background =
        'conic-gradient(var(--primary) 0deg '+choiceDeg+'deg, #10B981 '+choiceDeg+'deg '+(choiceDeg+fillDeg)+'deg, #F59E0B '+(choiceDeg+fillDeg)+'deg 360deg)';
      document.getElementById('donut-inner').textContent = total+'题';
      document.getElementById('dist-choice').textContent = choice;
      document.getElementById('dist-choice-p').textContent = Math.round(choice/total*100);
      document.getElementById('dist-fill').textContent = fill;
      document.getElementById('dist-fill-p').textContent = Math.round(fill/total*100);
      document.getElementById('dist-sol').textContent = sol;
      document.getElementById('dist-sol-p').textContent = Math.round(sol/total*100);
    }

    // ---- 主渲染 ----
    var currentDays = 7;
    var currentData = null;

    function renderAll(days) {
      var actualDays = days===0 ? (parseInt(document.getElementById('total-days').textContent)||60) : days;
      var data = generateData(actualDays);
      currentData = data;
      currentDays = actualDays;

      // 概览
      var summary = renderSummary(data);

      // 做题热力图模式
      var modeClass = 'show-bar';
      if (actualDays<=14) modeClass = 'show-bar';
      else if (actualDays<=90) modeClass = 'show-cal';
      else if (actualDays<=730) modeClass = 'show-week';
      else modeClass = 'show-month';
      document.getElementById('daily-chart').className = 'daily-chart '+modeClass;

      renderBar(data);
      renderCal(data);
      renderWeek(data);
      renderMonth(data);

      var modeText = actualDays<=14?'按天':actualDays<=90?'按天':actualDays<=730?'按周':'按月';
      var label = ({7:'近7天',30:'近30天',90:'近3个月',365:'近1年'}[days])||(days===0?'全部时段':'近'+days+'天');
      document.getElementById('daily-hint').textContent = label+' · '+modeText+'（'+actualDays+'天）';

      // 正确率 & 积分趋势
      renderAccTrend(data);
      renderPointsTrend(data);
      document.getElementById('acc-label').textContent = label;
      document.getElementById('points-label').textContent = label;

      // 题型分布
      document.getElementById('dist-label').textContent = label;
      renderDistribution(data, summary);
    }

    // ---- 对外接口 ----
    function forceMode(cls) {
      document.getElementById('daily-chart').className = 'daily-chart '+cls;
      var names = {'show-bar':'条形图','show-cal':'7行周历','show-week':'周格','show-month':'月格'};
      document.getElementById('daily-hint').textContent = names[cls]+'（调试模式 · '+currentDays+'天）';
    }

    function selectRange(el, days) {
      document.querySelectorAll('.sort-pill').forEach(function(p){p.classList.remove('active')});
      el.classList.add('active');
      renderAll(days);
    }

    // ---- 初始化 ----
    renderAll(7);
  </script>
</body>
</html>
