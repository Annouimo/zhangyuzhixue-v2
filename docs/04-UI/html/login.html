<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 — 章鱼智学</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Flutter 注意：📚 中 📚 已替换为 Material Icon， 保留（品牌） -->
  <div class="page">
    <div class="auth-card">
      <p class="text-secondary text-center" style="font-size:14px;margin-bottom:4px;">
         章鱼智学 — 北京高考数学 · 题库 · 讲义 · 解题训练
      </p>
      <h2>📚 登录</h2>

      <form onsubmit="return false;">
        <div class="input-group">
          <label for="username">用户名</label>
          <input type="text" id="username" placeholder="输入用户名"
                 data-db-bind="auth.login.username" required autofocus>
        </div>
        <div class="input-group">
          <label for="password">密码</label>
          <input type="password" id="password" placeholder="输入密码"
                 data-db-bind="auth.login.password" required>
        </div>
        <button class="btn btn-primary btn-block mt-2" data-db-action="auth.login()">
          登录
        </button>
      </form>

      <!-- 同步失败提示（登录后弹出） -->
      <div class="snackbar" id="sync-fail-snack" style="display:none;margin-top:12px;padding:12px 16px;background:var(--warning);border-radius:var(--radius-sm);font-size:13px;color:#fff;display:flex;align-items:center;justify-content:space-between;">
        <span>数据同步失败，部分数据可能未恢复</span>
        <a href="sync_queue.html" style="color:#fff;font-weight:600;text-decoration:underline;white-space:nowrap;margin-left:12px;">去同步 →</a>
      </div>

      <div class="auth-links">
        还没有账号？<a href="register.html">使用邀请码注册</a>
      </div>
      <div style="text-align:center;margin-top:12px;">
        <a href="#" onclick="exportLog();return false;" style="font-size:11px;color:var(--text-muted);text-decoration:none;">导出日志</a>
      </div>
    </div>
  </div>

<script>
function exportLog() {
  alert('日志已导出，可通过微信发送');
}
</script>
</body>
</html>
