<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>解题 · 填空 - 章鱼智学</title>
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="solve.css">
</head>
<body>
  <!-- Flutter 注意：emoji 图标在 Flutter 中已替换为 Material Icon -->
  <div class="page-header">
    <a href="javascript:history.back()" class="back-btn">← 返回</a>
    <h1>解题模式</h1>
  </div>

  <div class="solve-container">
    <div class="question-meta">
      第 <span>3</span> 题　
      <span>导数第 1 讲课后练习</span>
      <span class="text-secondary">[填空]</span>
      <div class="attempt-selector" id="attempt-selector" style="display:none;">
        <div class="attempt-trigger" id="attempt-trigger" onclick="toggleAttemptDropdown()">
          <span id="attempt-label">第 1 次作答</span>
          <span class="arrow">▼</span>
        </div>
        <div class="attempt-dropdown" id="attempt-dropdown"></div>
      </div>
      <span class="attempt-badge" id="attempt-badge-single">第 1 次作答</span>
    </div>

    <div class="review-banner" id="review-banner" style="display:none;">
      📋 回顾模式 · 只读浏览，不可修改
    </div>

    <div class="question-stem">
      <p><strong>相关概念</strong>：余弦定理</p>
      <p style="margin-top:8px;">在三角形 ABC 中，角 A、B、C 的对边分别是 a、b、c，且满足 a² + b² - c² = ab，求 C 的大小。</p>
    </div>

    <div class="action-bar" id="fill-action">
      <button class="btn btn-primary" id="reveal-btn" disabled>查看答案</button>
      <div class="cooldown-text" id="cooldown-text">⏳ 还剩 10 秒可查看</div>
    </div>

    <div class="result-area" id="result-area" style="display:none;">
      <div class="result-badge reveal">正确答案</div>
      <div class="answer-value">60°</div>
      <div class="analysis-text" style="text-align:left;margin-top:8px;">
        <p>由余弦定理 cos C = (a² + b² - c²) / (2ab)，代入 a² + b² - c² = ab，得 cos C = 1/2，故 C = 60°。</p>
      </div>
      <!-- 自评反馈 -->
      <div class="feedback-row" id="feedback-row">
        <div style="font-size:13px;color:var(--text-secondary);margin-bottom:8px;">你觉得自己答对了吗？</div>
        <div style="display:flex;gap:12px;">
          <button class="btn btn-sm btn-primary" id="fb-correct" onclick="onFeedback('correct')">✅ 正确</button>
          <button class="btn btn-sm btn-outline" id="fb-wrong" onclick="onFeedback('wrong')">❌ 错误</button>
        </div>
      </div>
      <div id="feedback-result" style="display:none;text-align:center;padding:8px 0;"></div>
    </div>

    <div id="done-section" class="done-section" style="display:none;">
      <div class="done-banner">🎉 已完成</div>
      <div class="done-actions">
        <button class="btn btn-outline" onclick="goNext()">下一题 →</button>
        <button class="btn btn-outline" onclick="goRate()">⭐ 评分</button>
      </div>
    </div>
  </div>

  <script src="solve-utils.js"></script>
  <script>
  // =================================================================
  //  填空题 — 支持 URL 参数: ?mode=first|resume|review&attempt_id=X
  // =================================================================

  var DEMO_ATTEMPTS = [
    { id: 1, label: '第 1 次作答', completed: true, answerRevealed: true, feedbackGiven: true, feedbackCorrect: true },
    { id: 2, label: '第 2 次作答', completed: false, answerRevealed: false },
    { id: 3, label: '第 3 次作答', completed: false, answerRevealed: false }
  ];

  var _currentAttemptId = null;

  function getUrlParams() {
    var p = {};
    location.search.replace(/[?&]([^=]+)=([^&]*)/g, function(_, k, v) { p[k] = decodeURIComponent(v); });
    return p;
  }

  function initFromUrl() {
    var p = getUrlParams();
    var mode = p.mode || 'first';
    var id = p.attempt_id ? parseInt(p.attempt_id) : null;
    if (mode === 'first') {
      var newId = DEMO_ATTEMPTS.length + 1;
      DEMO_ATTEMPTS.push({ id: newId, label: '第 ' + newId + ' 次作答', completed: false, answerRevealed: false });
      _currentAttemptId = newId;
    } else if (id && DEMO_ATTEMPTS.find(function(a) { return a.id === id; })) {
      _currentAttemptId = id;
    } else {
      _currentAttemptId = DEMO_ATTEMPTS[DEMO_ATTEMPTS.length - 1].id;
    }
  }

  function renderView() {
    var att = DEMO_ATTEMPTS.find(function(a) { return a.id === _currentAttemptId; });
    if (!att) return;

    var isSingle = DEMO_ATTEMPTS.length <= 1;
    document.getElementById('attempt-selector').style.display = isSingle ? 'none' : 'inline-block';
    document.getElementById('attempt-badge-single').style.display = isSingle ? 'inline' : 'none';
    document.getElementById('attempt-badge-single').textContent = att.label;
    document.getElementById('attempt-label').textContent = att.label;

    var allDone = DEMO_ATTEMPTS.filter(function(a) { return a.completed; });
    var lastDone = allDone[allDone.length - 1];
    document.getElementById('review-banner').style.display = (att.completed && lastDone && att.id !== lastDone.id) ? 'block' : 'none';

    renderDropdown(att.id);

    if (att.answerRevealed) {
      document.getElementById('fill-action').style.display = 'none';
      document.getElementById('result-area').style.display = 'block';
      document.getElementById('done-section').style.display = 'block';
      var fbRow = document.getElementById('feedback-row');
      var fbResult = document.getElementById('feedback-result');
      if (att.feedbackGiven) {
        fbRow.style.display = 'none';
        fbResult.style.display = 'block';
        fbResult.innerHTML = att.feedbackCorrect
          ? '✅ 回答正确！<br><span style="font-size:12px;color:var(--text-secondary);">+1.0 积分</span>'
          : '❌ 回答有误<br><span style="font-size:12px;color:var(--text-secondary);">继续加油 💪</span>';
        fbResult.style.color = att.feedbackCorrect ? 'var(--primary)' : 'var(--text-secondary)';
      } else {
        fbRow.style.display = 'block';
        fbResult.style.display = 'none';
      }
    } else {
      document.getElementById('fill-action').style.display = 'block';
      document.getElementById('result-area').style.display = 'none';
      document.getElementById('done-section').style.display = 'none';
      startCooldown(10, document.getElementById('reveal-btn'), document.getElementById('cooldown-text'));
    }
  }

  function renderDropdown(activeId) {
    var dd = document.getElementById('attempt-dropdown'); dd.innerHTML = '';
    DEMO_ATTEMPTS.forEach(function(a) {
      var opt = document.createElement('div');
      opt.className = 'attempt-option' + (a.id === activeId ? ' active' : '');
      var l = document.createElement('span'); l.textContent = a.label; opt.appendChild(l);
      var s = document.createElement('span');
      if (a.completed) { s.className='opt-status review'; s.textContent='回顾'; }
      else { s.className='opt-status'; s.textContent=a.id===activeId?'当前':'未完成'; }
      opt.appendChild(s);
      opt.onclick = function() { switchAttempt(a.id); };
      dd.appendChild(opt);
    });
  }

  function switchAttempt(id) {
    if (id === _currentAttemptId) { closeDropdown(); return; }
    _currentAttemptId = id; closeDropdown(); renderView();
    var a = DEMO_ATTEMPTS.find(function(x) { return x.id === id; });
    if (a.completed) showToast('📋', a.label + ' · 回顾模式');
  }

  function createNewAttempt() {
    closeDropdown();
    var newId = DEMO_ATTEMPTS.length + 1;
    DEMO_ATTEMPTS.push({ id: newId, label: '第 ' + newId + ' 次作答', completed: false, answerRevealed: false });
    _currentAttemptId = newId; renderView();
    showToast('🆕', '已创建第 ' + newId + ' 次作答');
  }

  function toggleAttemptDropdown() {
    var dd = document.getElementById('attempt-dropdown'), tr = document.getElementById('attempt-trigger');
    dd.classList.toggle('show'); tr.classList.toggle('open');
    if (dd.classList.contains('show')) renderDropdown(_currentAttemptId);
  }
  function closeDropdown() {
    document.getElementById('attempt-dropdown').classList.remove('show');
    document.getElementById('attempt-trigger').classList.remove('open');
  }
  document.addEventListener('click', function(e) { var s=document.getElementById('attempt-selector'); if(s&&!s.contains(e.target)) closeDropdown(); });

  var FEEDBACK_GIVEN = false;

  document.getElementById('reveal-btn').addEventListener('click', function() {
    document.getElementById('fill-action').style.display = 'none';
    document.getElementById('result-area').style.display = 'block';
    document.getElementById('feedback-row').style.display = 'block';
  });

  function onFeedback(type) {
    if (FEEDBACK_GIVEN) return;
    FEEDBACK_GIVEN = true;
    document.getElementById('feedback-row').style.display = 'none';
    var resultEl = document.getElementById('feedback-result');
    resultEl.style.display = 'block';
    if (type === 'correct') {
      resultEl.innerHTML = '✅ 回答正确！<br><span style="font-size:12px;color:var(--text-secondary);">+1.0 积分</span>';
      resultEl.style.color = 'var(--primary)';
    } else {
      resultEl.innerHTML = '❌ 回答有误<br><span style="font-size:12px;color:var(--text-secondary);">继续加油 💪</span>';
      resultEl.style.color = 'var(--text-secondary)';
    }
    document.getElementById('done-section').style.display = 'block';
  }

  function goNext() { showToast('📝', '进入下一题（Flutter 中执行路由跳转）'); }
  function goRate() { parent.goFile('solve-rate.html'); }

  document.addEventListener('DOMContentLoaded', function() { initFromUrl(); renderView(); });
  </script>
</body>
</html>
