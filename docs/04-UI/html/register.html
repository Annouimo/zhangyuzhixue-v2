<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 — 章鱼智学</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Flutter 注意：📝 图标在 Flutter 中已替换为 Material Icon -->
  <div class="page">
    <div class="auth-card">
      <p class="text-secondary text-center" style="font-size:14px;margin-bottom:4px;">
         章鱼智学 — 北京高考数学 · 题库 · 讲义 · 解题训练
      </p>
      <h2>📝 学生注册</h2>

      <form onsubmit="return false;">
        <div class="input-group">
          <label for="invitation_code">邀请码</label>
          <input type="text" id="invitation_code" placeholder="输入邀请码，如 GR7X-K2P9-M4VB"
                 data-db-bind="auth.register.inviteCode" required autocomplete="off" autofocus>
        </div>
        <div class="input-group">
          <label for="username">用户名（昵称）</label>
          <input type="text" id="username" placeholder="起个用户名，用于登录"
                 data-db-bind="auth.register.username" required autocomplete="username">
        </div>
        <div class="input-group">
          <label for="real_name">真实姓名 <span class="text-secondary" style="font-weight:400;font-size:12px;">（提交后不可修改）</span></label>
          <input type="text" id="real_name" placeholder="输入真实姓名"
                 data-db-bind="auth.register.realName" required>
        </div>
        <div class="input-group">
          <label for="phone">手机号 <span class="text-secondary" style="font-weight:400;font-size:12px;">（提交后不可修改）</span></label>
          <input type="tel" id="phone" placeholder="11位手机号，用于找回账号"
                 data-db-bind="auth.register.phone" required autocomplete="tel">
        </div>
        <div class="input-group">
          <label for="gaokao_year">高考年份</label>
          <select id="gaokao_year" required data-db-bind="auth.register.gaokaoYear"
                  style="width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:15px;background:var(--card);outline:none;">
            <option value="">--- 请选择 ---</option>
            <option value="2025">2025 年</option>
            <option value="2026" selected>2026 年</option>
            <option value="2027">2027 年</option>
            <option value="2028">2028 年</option>
          </select>
        </div>
        <div class="input-group">
          <label for="password1">密码</label>
          <input type="password" id="password1" placeholder="设置密码（至少8位）"
                 data-db-bind="auth.register.password" required autocomplete="new-password">
        </div>
        <div class="input-group">
          <label for="password2">确认密码</label>
          <input type="password" id="password2" placeholder="再次输入密码"
                 data-db-bind="auth.register.passwordConfirm" required autocomplete="new-password">
        </div>
        <button class="btn btn-primary btn-block mt-2" data-db-action="auth.register()">
          注册
        </button>
      </form>

      <div class="auth-links">
        已有账号？<a href="login.html">去登录</a>
      </div>
    </div>
  </div>
</body>
</html>
