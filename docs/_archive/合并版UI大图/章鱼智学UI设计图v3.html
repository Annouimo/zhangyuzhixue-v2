  {g:'组卷',i:['🤖 智能组卷','🖐️ 自主选题','👁️ 预览-自己','👁️ 预览-他人','📋 我的组卷','🌐 发现组卷','🔖 我的收藏','✅ 快对答案']},
  {g:'讲义',i:['📖 课程列表','📑 章节列表','📖 讲义内容']},
  {g:'我的',i:['✏️ 个人信息编辑','🏆 成就','📊 学习统计','📝 做题历史','💰 积分流水','🏅 等级详情','🔄 同步状态','ℹ️ 关于','⚙️ 调试工具']},
  {g:'学习偏好',i:['🎯 首次引导','📋 偏好管理','✏️ 偏好编辑']},
  {g:'登录注册',i:['🔑 登录','📝 注册']},
];

var vf=document.getElementById('vf'),pt=document.getElementById('pt'),pd=document.getElementById('pd');
var hist=[]; // 导航历史

function decode(b64){
  var bin=atob(b64),bytes=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

function loadPage(idx){
  if(idx===undefined||idx<0||idx>=P.length) return;
  var p=P[idx],css=decode(CSS_B64),body=decode(p.b);
  // 注入 CSS
  body = body.replace('</head>','<style>'+css+'</style></head>');
  // 注入导航拦截脚本（放在 body 末尾）
  var navScript = '<script>' +
    'document.addEventListener("click",function(e){' +
      'var a=e.target.closest("a");' +
      'if(a&&a.href&&a.href.match(/\\.html/)){' +
        'e.preventDefault();' +
        'parent.goFile(a.href.substring(a.href.lastIndexOf("/")+1));' +
      '}' +
    '});' +
    // 拦截 history.back() 的 <a> 点击
    'var origBack=window.history.back;' +
    'window.history.back=function(){parent.goBack();};' +
    // 拦截 onclick 中的 location.href
    'var origDesc=Object.getOwnPropertyDescriptor(window,"location");' +
    'var _href="";' +
    'Object.defineProperty(window,"location",{' +
      'get:function(){return window.location;},' +
      'set:function(v){' +
        'var m=v&&v.match?.(/([^/]+\.html)/);' +
        'if(m) parent.goFile(m[1]);' +
        'else window.location=v;' +
      '}' +
    '});' +
  '<\/script>';
  body = body.replace('</body>', navScript + '</body>');
  vf.srcdoc = body;
  pt.textContent = p.n;
  pd.textContent = p.d||'';
  document.querySelectorAll('.nav-item').forEach(function(e){e.classList.remove('active')});
  var el=document.querySelector('[data-i="'+idx+'"]');
  if(el) el.classList.add('active');
}

function goFile(file){
  var idx=FILE_MAP[file];
  if(idx!==undefined){
    var cur=NAME_MAP[pt.textContent];
    if(cur!==undefined) hist.push(cur);
    loadPage(idx);
  }
}

function goBack(){
  if(hist.length>0) loadPage(hist.pop());
}

// 构建导航
GROUPS.forEach(function(g){
  var gt=document.createElement('div');gt.className='nav-group';
  var t=document.createElement('div');t.className='nav-group-title';t.textContent=g.g;
  gt.appendChild(t);
  g.i.forEach(function(nm){
    var idx=NAME_MAP[nm];if(idx===undefined)return;
    var a=document.createElement('a');a.className='nav-item';a.setAttribute('data-i',idx);
    a.textContent=nm;a.href='javascript:void(0)';
    a.onclick=function(){
      var cur=NAME_MAP[pt.textContent];
      if(cur!==undefined&&cur!==idx) hist.push(cur);
      loadPage(idx);
    };
    gt.appendChild(a);
  });
  document.getElementById('nav').appendChild(gt);
});

loadPage(0);
</script>
</body>
</html>
