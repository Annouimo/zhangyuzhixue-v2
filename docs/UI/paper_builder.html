<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自主组卷 - 章鱼智学</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .selected-count {
      font-size: 13px;
      color: var(--primary);
      font-weight: 600;
    }
    .question-item {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      background: var(--card);
      border-radius: var(--radius-sm);
      margin-bottom: 6px;
      box-shadow: var(--shadow);
      font-size: 13px;
    }
    .question-item .q-info { flex: 1; }
    .question-item .q-add {
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--card);
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .question-item .q-add.selected { background: var(--primary); color: #fff; border-color: var(--primary); }
  </style>
</head>
<body>
  <div class="page-header">
    <a href="home.html" class="back-btn">← 返回</a>
    <h1>自主组卷</h1>
  </div>

  <div class="page" style="padding-top:8px;">
    <div class="paper-layout">
      <!-- 试卷名称 -->
      <div class="input-group">
        <label>试卷名称</label>
        <input type="text" placeholder="输入试卷名称" data-db="exam.name" value="我的练习卷">
      </div>

      <!-- 筛选区域 -->
      <div class="paper-filter-area">
        <div class="filter-section" data-db-loop="filter_sections">
          <div class="filter-header" onclick="toggleFilter(this)">
            <span>按来源选题</span>
            <span>▾</span>
          </div>
          <div class="filter-body">
            <div class="mb-4">
              <label style="font-size:13px;font-weight:500;display:block;margin-bottom:4px;">年份</label>
              <div class="flex gap-2" data-db-loop="filter.years">
                <label style="font-size:13px;"><input type="checkbox" checked> 2025</label>
                <label style="font-size:13px;"><input type="checkbox"> 2024</label>
                <label style="font-size:13px;"><input type="checkbox"> 2023</label>
              </div>
            </div>
            <div>
              <label style="font-size:13px;font-weight:500;display:block;margin-bottom:4px;">地区</label>
              <div class="flex gap-2" data-db-loop="filter.regions">
                <label style="font-size:13px;"><input type="checkbox" checked> 海淀</label>
                <label style="font-size:13px;"><input type="checkbox" checked> 东城</label>
                <label style="font-size:13px;"><input type="checkbox"> 西城</label>
                <label style="font-size:13px;"><input type="checkbox"> 朝阳</label>
              </div>
            </div>
            <div class="mt-2">
              <label style="font-size:13px;font-weight:500;display:block;margin-bottom:4px;">考试</label>
              <div class="flex gap-2">
                <label style="font-size:13px;"><input type="checkbox" checked> 一模</label>
                <label style="font-size:13px;"><input type="checkbox"> 二模</label>
                <label style="font-size:13px;"><input type="checkbox"> 期末</label>
              </div>
            </div>
          </div>
        </div>

        <div class="filter-section">
          <div class="filter-header" onclick="toggleFilter(this)">
            <span>按概念标签选题</span>
            <span>▾</span>
          </div>
          <div class="filter-body">
            <p class="text-secondary" style="font-size:13px;" data-db-loop="filter.concept_tags">
              <label style="display:inline-block;margin-right:8px;margin-bottom:4px;font-size:13px;">
                <input type="checkbox"> 集合</label>
              <label style="display:inline-block;margin-right:8px;margin-bottom:4px;font-size:13px;">
                <input type="checkbox"> 函数</label>
              <label style="display:inline-block;margin-right:8px;margin-bottom:4px;font-size:13px;">
                <input type="checkbox"> 导数</label>
              <label style="display:inline-block;margin-right:8px;margin-bottom:4px;font-size:13px;">
                <input type="checkbox"> 三角函数</label>
              <label style="display:inline-block;margin-right:8px;margin-bottom:4px;font-size:13px;">
                <input type="checkbox"> 数列</label>
            </p>
          </div>
        </div>

        <div class="filter-section">
          <div class="filter-header" onclick="toggleFilter(this)">
            <span>按知识卡片选题</span>
            <span>▾</span>
          </div>
          <div class="filter-body">
            <p class="text-secondary" style="font-size:13px;" data-db-loop="filter.knowledge_cards">
              <label style="display:block;margin-bottom:4px;font-size:13px;">
                <input type="checkbox"> 正弦定理</label>
              <label style="display:block;margin-bottom:4px;font-size:13px;">
                <input type="checkbox"> 余弦定理</label>
              <label style="display:block;margin-bottom:4px;font-size:13px;">
                <input type="checkbox"> 辅助角公式</label>
            </p>
          </div>
        </div>

        <div class="filter-section">
          <div class="filter-header" onclick="toggleFilter(this)">
            <span>按难度/计算量选题</span>
            <span>▾</span>
          </div>
          <div class="filter-body">
            <div class="mb-2">
              <span style="font-size:13px;">难度：</span>
              <span data-db="filter.difficulty_min">0</span> - <span data-db="filter.difficulty_max">10</span>
              <input type="range" min="0" max="10" value="5" style="width:100%;" data-db-action="filter.set_difficulty_range">
            </div>
            <div>
              <span style="font-size:13px;">计算量：</span>
              <span data-db="filter.calculation_min">0</span> - <span data-db="filter.calculation_max">10</span>
              <input type="range" min="0" max="10" value="5" style="width:100%;" data-db-action="filter.set_calculation_range">
            </div>
          </div>
        </div>
      </div>

      <!-- 选题区域 -->
      <div class="flex items-center justify-between" style="padding:4px 0;">
        <span style="font-size:15px;font-weight:600;">题目列表</span>
        <span class="selected-count" data-db="exam.selected_count">已选 2 题</span>
      </div>

      <div data-db-loop="search_results">
        <div class="question-item">
          <div class="q-info">
            <div><strong data-db="item.title">2025 东城一模 第 1 题</strong></div>
            <div class="text-secondary" data-db="item.meta">难度 <span data-db="item.difficulty">0.3</span> · 计算量 <span data-db="item.calculation">1.2</span></div>
          </div>
          <button class="q-add selected" data-db-action="exam.toggle_question(1)">✓</button>
        </div>
        <div class="question-item">
          <div class="q-info">
            <div><strong data-db="item.title">2025 东城一模 第 2 题</strong></div>
            <div class="text-secondary" data-db="item.meta">难度 <span data-db="item.difficulty">0.5</span> · 计算量 <span data-db="item.calculation">1.8</span></div>
          </div>
          <button class="q-add selected" data-db-action="exam.toggle_question(2)">✓</button>
        </div>
        <div class="question-item">
          <div class="q-info">
            <div><strong data-db="item.title">2025 东城一模 第 3 题</strong></div>
            <div class="text-secondary" data-db="item.meta">难度 <span data-db="item.difficulty">0.6</span> · 计算量 <span data-db="item.calculation">2.5</span></div>
          </div>
          <button class="q-add" data-db-action="exam.toggle_question(3)">+</button>
        </div>
      </div>

      <!-- 我的试卷预览 -->
      <div class="card paper-preview-area">
        <h3 style="font-size:15px;font-weight:600;margin-bottom:8px;">我的试卷</h3>
        <div class="text-secondary" style="font-size:13px;" data-db="exam.summary">
          选择 <span data-db="exam.choice_count">2</span> 题
          · 填空 <span data-db="exam.fill_count">0</span> 题
          · 解答 <span data-db="exam.solve_count">0</span> 题
          · 共 <span data-db="exam.total_count">2</span> 题
        </div>
        <div class="paper-questions mt-2" data-db-loop="exam.selected_questions">
          <div class="question-item">
            <div class="q-info">
              <div data-db="item.title">2025 东城一模 第 1 题</div>
            </div>
            <button class="q-add selected" data-db-action="exam.remove_question(1)">✕</button>
          </div>
          <div class="question-item">
            <div class="q-info">
              <div data-db="item.title">2025 东城一模 第 2 题</div>
            </div>
            <button class="q-add selected" data-db-action="exam.remove_question(2)">✕</button>
          </div>
        </div>

        <div class="paper-actions">
          <button class="btn btn-outline btn-sm" data-db-action="exam.download_pdf">下载 PDF</button>
          <a href="solve.html" class="btn btn-outline btn-sm" data-db-action="exam.quick_answer">快对答案</a>
          <button class="btn btn-ghost btn-sm" style="color:var(--error);" data-db-action="exam.delete">删除</button>
        </div>
      </div>

      <!-- 确认组卷 -->
      <button class="btn btn-primary btn-block mt-2" data-db-action="exam.confirm()">
        确认组卷（消耗 <span data-db="exam.points_cost">10</span> 积分）
      </button>
    </div>
  </div>

  <script>
    function toggleFilter(header) {
      var section = header.parentElement;
      section.classList.toggle('open');
    }
  </script>
</body>
</html>
