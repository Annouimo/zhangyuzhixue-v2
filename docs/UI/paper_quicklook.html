<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>试卷预览 - 章鱼智学</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .question-item {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      background: var(--card);
      border-radius: var(--radius-sm);
      margin-bottom: 6px;
      box-shadow: var(--shadow);
      font-size: 13px;
    }
    .question-item .q-info { flex: 1; }
  </style>
</head>
<body>
  <div class="page-header">
    <a href="paper_builder.html" class="back-btn">← 返回</a>
    <h1>试卷预览</h1>
  </div>

  <div class="page" style="padding-top:8px;">
    <!-- 试卷名称 -->
    <div class="card">
      <div style="font-size:17px;font-weight:600;" data-db="exam.name">我的练习卷</div>
      <div class="text-secondary" style="font-size:13px;margin-top:4px;" data-db="exam.summary">
        选择 <span data-db="exam.choice_count">2</span> 题
        · 填空 <span data-db="exam.fill_count">0</span> 题
        · 解答 <span data-db="exam.solve_count">0</span> 题
        · 共 <span data-db="exam.total_count">2</span> 题
      </div>
    </div>

    <!-- 操作按钮 -->
    <div class="flex gap-2 mt-4">
      <button class="btn btn-outline flex-1" data-db-action="exam.download_pdf">下载 PDF</button>
      <a href="solve.html" class="btn btn-outline flex-1" data-db-action="exam.quick_answer">快对答案</a>
      <button class="btn btn-ghost flex-1" style="color:var(--error);" data-db-action="exam.delete">删除</button>
    </div>

    <!-- 题目列表 -->
     <!-- 批语：题目列表尽量往后放，因为题目可能比较多，显示起来很长 -->
    <h3 style="font-size:15px;font-weight:600;margin:12px 0 8px;">已选题目</h3>
    <div data-db-loop="exam.selected_questions">
      <div class="question-item">
        <div class="q-info">
          <div data-db="item.title">2025 东城一模 第 1 题</div>
          <div class="text-secondary" data-db="item.meta">选择题 · 难度 0.3 · 计算量 1.2</div>
          <!-- 批语：增加：点击这个按钮，进入解题页面solve.html -->
        </div>
      </div>
      <div class="question-item">
        <div class="q-info">
          <div data-db="item.title">2025 东城一模 第 2 题</div>
          <div class="text-secondary" data-db="item.meta">选择题 · 难度 0.5 · 计算量 1.8</div>
        </div>
      </div>
    </div>

    
  </div>
</body>
</html>
