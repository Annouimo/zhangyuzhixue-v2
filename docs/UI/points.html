<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>积分流水 - 章鱼智学</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page-header">
    <a href="profile.html" class="back-btn">← 返回</a>
    <h1>积分流水</h1>
  </div>

  <div class="page" style="padding-top:8px;">
    <!-- 当前积分 -->
    <div class="card text-center">
      <p class="text-secondary" style="font-size:14px;">当前积分</p>
      <p style="font-size:36px;font-weight:700;color:var(--primary);" data-db="user.points">9.2</p>
    </div>

    <!-- 积分流水表格 -->
    <div data-db-loop="points_history" data-db-empty="暂无流水记录">
      <table class="data-table">
        <thead>
          <tr>
            <th data-db="table_header.time">时间</th>
            <th data-db="table_header.type">类型</th>
            <th data-db="table_header.change">变动</th>
            <th data-db="table_header.balance">余额</th>
            <th data-db="table_header.note">说明</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td data-db="item.time">2025-03-15 14:30</td>
            <td data-db="item.type">做题</td>
            <td style="color:var(--success);" data-db="item.change">+1.5</td>
            <td data-db="item.balance">9.2</td>
            <td data-db="item.note">完成 2025 海淀一模 Q20</td>
          </tr>
          <tr>
            <td data-db="item.time">2025-03-14 10:20</td>
            <td data-db="item.type">组卷</td>
            <td style="color:var(--error);" data-db="item.change">-10.0</td>
            <td data-db="item.balance">7.7</td>
            <td data-db="item.note">自主组卷"导数练习"</td>
          </tr>
          <tr>
            <td data-db="item.time">2025-03-10 09:15</td>
            <td data-db="item.type">做题</td>
            <td style="color:var(--success);" data-db="item.change">+2.0</td>
            <td data-db="item.balance">17.7</td>
            <td data-db="item.note">完成 2025 东城一模 Q19</td>
          </tr>
          <tr>
            <td data-db="item.time">2025-03-08 16:00</td>
            <td data-db="item.type">做题</td>
            <td style="color:var(--success);" data-db="item.change">+1.0</td>
            <td data-db="item.balance">15.7</td>
            <td data-db="item.note">完成 2025 西城一模 Q14</td>
          </tr>
          <tr>
            <td data-db="item.time">2025-03-01 08:00</td>
            <td data-db="item.type">签到</td>
            <td style="color:var(--success);" data-db="item.change">+0.5</td>
            <td data-db="item.balance">14.7</td>
            <td data-db="item.note">每日签到奖励</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="home.html" class="nav-item">
      <span class="nav-icon">🏠</span>
      <span>首页</span>
    </a>
    <a href="homework.html" class="nav-item">
      <span class="nav-icon">📚</span>
      <span>作业</span>
    </a>
    <a href="lecture_courses.html" class="nav-item">
      <span class="nav-icon">📖</span>
      <span>讲义</span>
    </a>
    <a href="profile.html" class="nav-item active">
      <span class="nav-icon">👤</span>
      <span>我的</span>
    </a>
  </nav>
</body>
</html>
