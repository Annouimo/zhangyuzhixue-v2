<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>组卷历史 - 章鱼智学</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .question-item {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      background: var(--card);
      border-radius: var(--radius-sm);
      margin-bottom: 6px;
      box-shadow: var(--shadow);
      font-size: 13px;
    }
    .question-item .q-info { flex: 1; }
  </style>
</head>
<body>
  <div class="page-header">
    <a href="profile.html" class="back-btn">← 返回</a>
    <h1>组卷历史</h1>
  </div>

  <div class="page" style="padding-top:8px;">
    <!-- 试卷列表 -->
    <div data-db-loop="exam_history_list" data-db-empty="暂无组卷记录">

      <!-- 第 1 张试卷 -->
      <div class="card">
        <div class="flex items-center justify-between">
          <div>
            <div style="font-size:15px;font-weight:600;" data-db="item.name">导数练习卷</div>
            <div class="text-secondary" style="font-size:12px;margin-top:2px;" data-db="item.date">2025-03-14</div>
          </div>
          <div class="text-secondary" style="font-size:12px;" data-db="item.summary">
            选择 2 题 · 填空 0 题 · 解答 1 题 · 共 3 题
          </div>
        </div>
        <div class="paper-actions mt-2" style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn btn-outline btn-sm" data-db-action="exam.download_pdf(1)">下载 PDF</button>
          <a href="solve.html" class="btn btn-outline btn-sm" data-db-action="exam.quick_answer(1)">快对答案</a>
          <button class="btn btn-ghost btn-sm" style="color:var(--error);" data-db-action="exam.delete(1)">删除</button>
        </div>
      </div>

      <!-- 第 2 张试卷 -->
      <div class="card">
        <div class="flex items-center justify-between">
          <div>
            <div style="font-size:15px;font-weight:600;" data-db="item.name">三角函数专项</div>
            <div class="text-secondary" style="font-size:12px;margin-top:2px;" data-db="item.date">2025-03-10</div>
          </div>
          <div class="text-secondary" style="font-size:12px;" data-db="item.summary">
            选择 5 题 · 填空 3 题 · 解答 0 题 · 共 8 题
          </div>
        </div>
        <div class="paper-actions mt-2" style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn btn-outline btn-sm" data-db-action="exam.download_pdf(2)">下载 PDF</button>
          <a href="solve.html" class="btn btn-outline btn-sm" data-db-action="exam.quick_answer(2)">快对答案</a>
          <button class="btn btn-ghost btn-sm" style="color:var(--error);" data-db-action="exam.delete(2)">删除</button>
        </div>
      </div>

      <!-- 第 3 张试卷 -->
      <div class="card">
        <div class="flex items-center justify-between">
          <div>
            <div style="font-size:15px;font-weight:600;" data-db="item.name">期末冲刺</div>
            <div class="text-secondary" style="font-size:12px;margin-top:2px;" data-db="item.date">2025-03-01</div>
          </div>
          <div class="text-secondary" style="font-size:12px;" data-db="item.summary">
            选择 3 题 · 填空 2 题 · 解答 4 题 · 共 9 题
          </div>
        </div>
        <div class="paper-actions mt-2" style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn btn-outline btn-sm" data-db-action="exam.download_pdf(3)">下载 PDF</button>
          <a href="solve.html" class="btn btn-outline btn-sm" data-db-action="exam.quick_answer(3)">快对答案</a>
          <button class="btn btn-ghost btn-sm" style="color:var(--error);" data-db-action="exam.delete(3)">删除</button>
        </div>
      </div>

    </div>
  </div>

  <nav class="bottom-nav">
    <a href="home.html" class="nav-item">
      <span class="nav-icon">🏠</span>
      <span>首页</span>
    </a>
    <a href="homework.html" class="nav-item">
      <span class="nav-icon">📚</span>
      <span>作业</span>
    </a>
    <a href="lecture_courses.html" class="nav-item">
      <span class="nav-icon">📖</span>
      <span>讲义</span>
    </a>
    <a href="profile.html" class="nav-item active">
      <span class="nav-icon">👤</span>
      <span>我的</span>
    </a>
  </nav>
</body>
</html>
