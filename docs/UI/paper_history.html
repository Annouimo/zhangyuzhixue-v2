<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>组卷历史 - 章鱼智学</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page-header">
    <a href="homework.html" class="back-btn">← 返回</a>
    <h1 data-db="assignment.title">我的试卷</h1>
  </div>

  <div class="page" style="padding-top:8px;">
    <!-- 作业元信息 -->
    <!-- 我的试卷预览 -->
      <div class="card paper-preview-area">
        <div class="text-secondary" style="font-size:13px;" data-db="exam.summary">
          选择 <span data-db="exam.choice_count">2</span> 题
          · 填空 <span data-db="exam.fill_count">0</span> 题
          · 解答 <span data-db="exam.solve_count">0</span> 题
          · 共 <span data-db="exam.total_count">2</span> 题
        </div>
        

        <div class="paper-actions">
          <button class="btn btn-outline btn-sm" data-db-action="exam.download_pdf">下载 PDF</button>
          <a href="solve.html" class="btn btn-outline btn-sm" data-db-action="exam.quick_answer">快对答案</a>
          <button class="btn btn-ghost btn-sm" style="color:var(--error);" data-db-action="exam.delete">删除</button>
        </div>
      </div>

    <!-- 题目列表 -->
    <h3 style="font-size:15px;font-weight:600;margin:12px 0 8px;">题目列表</h3>
    <div data-db-loop="question_list">
      <a href="solve.html" class="list-item">
        <div class="left">
          <div class="title">
            <span data-db="item.number">第 3 题</span>
            <span class="text-secondary" data-db="item.type">解答题</span>
          </div>
        </div>
        <div class="right">
          <span class="status-tag in-progress" data-db="item.status">进行中</span>
        </div>
      </a>
      <a href="solve.html" class="list-item">
        <div class="left">
          <div class="title">
            <span data-db="item.number">第 6 题</span>
            <span class="text-secondary" data-db="item.type">解答题</span>
          </div>
        </div>
        <div class="right">
          <span class="status-tag in-progress" data-db="item.status">进行中</span>
        </div>
      </a>
      <a href="solve.html" class="list-item">
        <div class="left">
          <div class="title">
            <span data-db="item.number">第 2 题</span>
            <span class="text-secondary" data-db="item.type">选择题</span>
          </div>
        </div>
        <div class="right">
          <span class="status-tag pending" data-db="item.status">未做</span>
        </div>
      </a>
      <a href="solve.html" class="list-item">
        <div class="left">
          <div class="title">
            <span data-db="item.number">第 1 题</span>
            <span class="text-secondary" data-db="item.type">填空题</span>
          </div>
        </div>
        <div class="right">
          <span class="status-tag done" data-db="item.status">已完成</span>
        </div>
      </a>
      <a href="solve.html" class="list-item">
        <div class="left">
          <div class="title">
            <span data-db="item.number">第 4 题</span>
            <span class="text-secondary" data-db="item.type">选择题</span>
          </div>
        </div>
        <div class="right">
          <span class="status-tag done" data-db="item.status">已完成</span>
        </div>
      </a>
      <a href="solve.html" class="list-item">
        <div class="left">
          <div class="title">
            <span data-db="item.number">第 5 题</span>
            <span class="text-secondary" data-db="item.type">选择题</span>
          </div>
        </div>
        <div class="right">
          <span class="status-tag done" data-db="item.status">已完成</span>
        </div>
      </a>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="home.html" class="nav-item">
      <span class="nav-icon">🏠</span>
      <span>首页</span>
    </a>
    <a href="homework.html" class="nav-item active">
      <span class="nav-icon">📚</span>
      <span>作业</span>
    </a>
    <a href="lecture_courses.html" class="nav-item">
      <span class="nav-icon">📖</span>
      <span>讲义</span>
    </a>
    <a href="profile.html" class="nav-item">
      <span class="nav-icon">👤</span>
      <span>我的</span>
    </a>
  </nav>
</body>
</html>
