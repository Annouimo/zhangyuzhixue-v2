<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>首页 - 章鱼智学</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- 问候语 -->
  <div class="greeting">
    <span data-db="user.greeting">下午好</span>，<span data-db="user.real_name">李小红</span>
    <br><small data-db="user.school">欢迎回来</small>
  </div>

  <!-- 菜单入口 -->
  <div class="menu-grid">
    <a href="recommend.html" class="menu-item">
      <div class="icon">📋</div>
      <span>题目推荐</span>
    </a>
    <a href="paper_builder.html" class="menu-item">
      <div class="icon">📝</div>
      <span>自主组卷</span>
    </a>
  </div>

  <!-- 推荐题目预览 -->
  <div style="padding:0 16px;">
    <h3 style="font-size:16px;font-weight:600;margin-bottom:8px;">推荐题目</h3>
  </div>
  <div data-db-loop="recommended_questions" data-db-empty="暂无推荐题目">
    <a href="solve.html" class="list-item">
      <div class="left">
        <div class="title" data-db="item.title">2025 海淀一模 Q20</div>
        <div class="subtitle" data-db="item.type">解答题</div>
      </div>
      <div class="right">
        <span class="status-tag in-progress" data-db="item.status">进行中</span>
      </div>
    </a>
    <a href="solve.html" class="list-item">
      <div class="left">
        <div class="title" data-db="item.title">2025 东城一模 Q6</div>
        <div class="subtitle" data-db="item.type">解答题</div>
      </div>
      <div class="right">
        <span class="status-tag pending" data-db="item.status">未做</span>
      </div>
    </a>
    <a href="solve.html" class="list-item">
      <div class="left">
        <div class="title" data-db="item.title">2025 西城一模 Q14</div>
        <div class="subtitle" data-db="item.type">填空题</div>
      </div>
      <div class="right">
        <span class="status-tag done" data-db="item.status">已完成</span>
      </div>
    </a>
  </div>

  <!-- 底部导航 -->
  <nav class="bottom-nav">
    <a href="home.html" class="nav-item active">
      <span class="nav-icon">🏠</span>
      <span>首页</span>
    </a>
    <a href="homework.html" class="nav-item">
      <span class="nav-icon">📚</span>
      <span>作业</span>
    </a>
    <a href="lecture_courses.html" class="nav-item">
      <span class="nav-icon">📖</span>
      <span>讲义</span>
    </a>
    <a href="profile.html" class="nav-item">
      <span class="nav-icon">👤</span>
      <span>我的</span>
    </a>
  </nav>
</body>
</html>
