<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>班级概览 — 章鱼智学 · 教师端</title>
  <link rel="stylesheet" href="teacher-styles.css">
</head>
<body class="has-header">
  <header class="top-header">
    <div class="header-inner">
      <a href="index.html" class="brand"> 章鱼智学</a>
      <nav class="nav-links">
        <a href="index.html">作业</a>
        <a href="classes.html" class="active">班级</a>
        <a href="students.html">学生</a>
        <a href="about.html">关于</a>
      </nav>
      <div class="user-info">
        <div class="avatar">张</div>
        <span class="username">张老师</span>
        <a href="login.html" style="font-size:13px;color:var(--text-muted);text-decoration:none;margin-left:8px;">退出</a>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="page-header">
      <h1>班级概览</h1>
    </div>

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-value" data-db="classes.stats.totalStudents">90</div>
        <div class="stat-label">学生总数</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" data-db="classes.stats.totalClasses">3</div>
        <div class="stat-label">班级数</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" data-db="classes.stats.overallAccuracy">68%</div>
        <div class="stat-label">全校平均正确率</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" data-db="classes.stats.overallCompletion">76%</div>
        <div class="stat-label">作业平均完成率</div>
      </div>
    </div>

    <div data-db-loop="classes.list">
      <div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
          <h3 class="card-title" style="margin-bottom:0;" data-db="classes.list[].name">高三(1)班</h3>
          <a href="students.html?classId=1" class="btn btn-sm btn-outline">查看学生</a>
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;">
          <div>
            <div style="font-size:12px;color:var(--text-muted);">学生人数</div>
            <div style="font-size:20px;font-weight:700;" data-db="classes.list[].student_count">32</div>
          </div>
          <div>
            <div style="font-size:12px;color:var(--text-muted);">关联课程</div>
            <div style="font-size:20px;font-weight:700;" data-db="classes.list[].course_count">3</div>
          </div>
          <div>
            <div style="font-size:12px;color:var(--text-muted);">总做题量</div>
            <div style="font-size:20px;font-weight:700;" data-db="classes.list[].total_questions_done">1,024</div>
          </div>
          <div>
            <div style="font-size:12px;color:var(--text-muted);">平均正确率</div>
            <div style="font-size:20px;font-weight:700;color:var(--success);" data-db="classes.list[].average_accuracy">72%</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
          <h3 class="card-title" style="margin-bottom:0;" data-db="classes.list[].name">高三(2)班</h3>
          <a href="students.html?classId=2" class="btn btn-sm btn-outline">查看学生</a>
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;">
          <div>
            <div style="font-size:12px;color:var(--text-muted);">学生人数</div>
            <div style="font-size:20px;font-weight:700;" data-db="classes.list[].student_count">30</div>
          </div>
          <div>
            <div style="font-size:12px;color:var(--text-muted);">关联课程</div>
            <div style="font-size:20px;font-weight:700;" data-db="classes.list[].course_count">2</div>
          </div>
          <div>
            <div style="font-size:12px;color:var(--text-muted);">总做题量</div>
            <div style="font-size:20px;font-weight:700;" data-db="classes.list[].total_questions_done">860</div>
          </div>
          <div>
            <div style="font-size:12px;color:var(--text-muted);">平均正确率</div>
            <div style="font-size:20px;font-weight:700;color:var(--warning);" data-db="classes.list[].average_accuracy">65%</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
          <h3 class="card-title" style="margin-bottom:0;" data-db="classes.list[].name">高三(3)班</h3>
          <a href="students.html?classId=3" class="btn btn-sm btn-outline">查看学生</a>
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;">
          <div>
            <div style="font-size:12px;color:var(--text-muted);">学生人数</div>
            <div style="font-size:20px;font-weight:700;" data-db="classes.list[].student_count">28</div>
          </div>
          <div>
            <div style="font-size:12px;color:var(--text-muted);">关联课程</div>
            <div style="font-size:20px;font-weight:700;" data-db="classes.list[].course_count">3</div>
          </div>
          <div>
            <div style="font-size:12px;color:var(--text-muted);">总做题量</div>
            <div style="font-size:20px;font-weight:700;" data-db="classes.list[].total_questions_done">700</div>
          </div>
          <div>
            <div style="font-size:12px;color:var(--text-muted);">平均正确率</div>
            <div style="font-size:20px;font-weight:700;color:var(--success);" data-db="classes.list[].average_accuracy">70%</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
