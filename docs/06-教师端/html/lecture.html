<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>讲义 — 章鱼智学 · 教师端</title>
  <link rel="stylesheet" href="teacher-styles.css">
</head>
<body class="has-header">
  <header class="top-header">
    <div class="header-inner">
      <a href="index.html" class="brand">🐙 章鱼智学</a>
      <nav class="nav-links">
        <a href="index.html">作业</a>
        <a href="classes.html">班级</a>
        <a href="students.html">学生</a>
        <a href="lecture.html" class="active">讲义</a>
        <a href="about.html">关于</a>
      </nav>
      <div class="user-info">
        <div class="avatar">张</div>
        <span class="username">张老师</span>
        <a href="login.html" style="font-size:13px;color:var(--text-muted);text-decoration:none;margin-left:8px;">退出</a>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="page-header">
      <h1>讲义</h1>
    </div>

    <div class="card" style="text-align:center;padding:60px 40px;">
      <div style="font-size:64px;margin-bottom:16px;">📖</div>
      <h2 style="font-size:20px;font-weight:700;margin-bottom:12px;">讲义阅读请前往学生 App</h2>
      <p style="font-size:14px;color:var(--text-secondary);line-height:1.8;max-width:480px;margin:0 auto;">
        教师可使用教师账号登录学生 Flutter App（选择"学生端"登录），<br>
        在 App 中浏览全部课程讲义。<br><br>
        教师身份登录后将自动可见全部课程，不受班级过滤限制。
      </p>
      <div style="margin-top:24px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
        <div style="background:var(--primary-light);border-radius:var(--radius-sm);padding:12px 20px;font-size:13px;color:var(--text-secondary);">
          💡 教师可在学生 App 中：浏览题库、创建组卷、阅读讲义
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">讲义功能说明</div>
      <table class="data-table">
        <tr>
          <td style="color:var(--text-secondary);width:120px;">阅读平台</td>
          <td>学生 Flutter App（教师账号登录）</td>
        </tr>
        <tr>
          <td style="color:var(--text-secondary);">课程范围</td>
          <td>全部课程（教师身份时不按班级过滤）</td>
        </tr>
        <tr>
          <td style="color:var(--text-secondary);">讲义格式</td>
          <td>Markdown + LaTeX 数学公式，支持分页和展开</td>
        </tr>
        <tr>
          <td style="color:var(--text-secondary);">讲义更新</td>
          <td>联系管理员在 Django Admin 中编辑讲义内容</td>
        </tr>
      </table>
    </div>
  </div>
</body>
</html>
