<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>编辑资料 — 章鱼智学 · 教师端</title>
  <link rel="stylesheet" href="teacher-styles.css">
</head>
<body class="has-header">
  <header class="top-header">
    <div class="header-inner">
      <a href="index.html" class="brand">🐙 章鱼智学</a>
      <nav class="nav-links">
        <a href="index.html">作业</a>
        <a href="classes.html">班级</a>
        <a href="students.html">学生</a>
        <a href="lecture.html">讲义</a>
        <a href="about.html">关于</a>
      </nav>
      <div class="user-info">
        <div class="avatar">张</div>
        <span class="username">张老师</span>
        <a href="login.html" style="font-size:13px;color:var(--text-muted);text-decoration:none;margin-left:8px;">退出</a>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="page-header">
      <h1>编辑资料</h1>
    </div>

    <div class="card">
      <div class="avatar-upload">
        <div class="avatar-preview">
          <span>张</span>
        </div>
        <div>
          <button class="btn btn-sm btn-outline upload-btn">更换头像</button>
          <div style="font-size:12px;color:var(--text-muted);margin-top:4px;">支持 JPG/PNG，建议 1:1 比例</div>
        </div>
      </div>

      <form onsubmit="return false;">
        <div class="form-row">
          <div class="input-group">
            <label for="name">姓名</label>
            <input type="text" id="name" value="张老师" data-db-bind="profile.real_name">
          </div>
          <div class="input-group">
            <label for="school">学校</label>
            <input type="text" id="school" value="北京四中" data-db-bind="profile.school">
          </div>
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:20px;">
          <button class="btn btn-ghost" onclick="history.back()">取消</button>
          <button class="btn btn-primary" data-db-action="profile.save()" onclick="showToast('✅', '资料已保存')">保存</button>
        </div>
      </form>
    </div>

    <div class="card">
      <div class="card-title">账号安全</div>
      <div style="font-size:14px;color:var(--text-secondary);margin-bottom:12px;">
        密码由管理员管理，如需重置请联系管理员。
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--border);">
        <div>
          <div style="font-size:14px;font-weight:500;">用户名</div>
          <div style="font-size:13px;color:var(--text-muted);">zhanglaoshi</div>
        </div>
        <span style="font-size:13px;color:var(--text-muted);">不可修改</span>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--border);">
        <div>
          <div style="font-size:14px;font-weight:500;">角色</div>
        </div>
        <span class="status-tag" style="background:var(--primary-light);color:var(--primary);">教师</span>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container">
    <div class="toast-bar" id="toast-bar">
      <span class="toast-icon" id="toast-icon">✅</span>
      <span class="toast-msg" id="toast-msg">操作成功</span>
      <button class="toast-close" onclick="closeToast()">✕</button>
    </div>
  </div>

  <script>
    var _toastTimer = null;
    function showToast(icon, msg, duration) {
      var bar = document.getElementById('toast-bar');
      document.getElementById('toast-icon').textContent = icon;
      document.getElementById('toast-msg').textContent = msg;
      bar.classList.add('show');
      if (duration === undefined) duration = 3000;
      if (_toastTimer) clearTimeout(_toastTimer);
      _toastTimer = setTimeout(function() { bar.classList.remove('show'); }, duration);
    }
    function closeToast() {
      document.getElementById('toast-bar').classList.remove('show');
      if (_toastTimer) clearTimeout(_toastTimer);
    }
  </script>
</body>
</html>
