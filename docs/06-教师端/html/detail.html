<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作业详情 — 章鱼智学 · 教师端</title>
  <link rel="stylesheet" href="teacher-styles.css">
</head>
<body class="has-header">
  <header class="top-header">
    <div class="header-inner">
      <a href="index.html" class="brand">🐙 章鱼智学</a>
      <nav class="nav-links">
        <a href="index.html" class="active">作业</a>
        <a href="classes.html">班级</a>
        <a href="students.html">学生</a>
        <a href="about.html">关于</a>
      </nav>
      <div class="user-info">
        <div class="avatar">张</div>
        <span class="username">张老师</span>
        <a href="login.html" style="font-size:13px;color:var(--text-muted);text-decoration:none;margin-left:8px;">退出</a>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="page-header">
      <a href="index.html" class="btn btn-ghost" style="text-decoration:none;">← 返回</a>
      <div>
        <h1 data-db="assignment.detail.title">导数基础练习</h1>
      </div>
      <div class="page-actions">
        <button class="btn btn-outline btn-sm" onclick="showToast('🔔', '催交通知已发送');">🔔 催交</button>
        <button class="btn btn-ghost btn-sm" onclick="showToast('⚠️', '开发中：修改截止日期');">✏️ 编辑</button>
      </div>
    </div>

    <!-- 概览卡片 -->
    <div class="card">
      <div style="display:flex;gap:24px;flex-wrap:wrap;">
        <div>
          <div style="font-size:13px;color:var(--text-secondary);">截止日期</div>
          <div style="font-size:16px;font-weight:600;" data-db="assignment.detail.deadline">2026-07-15</div>
        </div>
        <div>
          <div style="font-size:13px;color:var(--text-secondary);">目标班级</div>
          <div style="font-size:16px;font-weight:600;" data-db="assignment.detail.classes">高三(1)班</div>
        </div>
        <div>
          <div style="font-size:13px;color:var(--text-secondary);">题目数量</div>
          <div style="font-size:16px;font-weight:600;" data-db="assignment.detail.questionCount">8 题</div>
        </div>
        <div>
          <div style="font-size:13px;color:var(--text-secondary);">作业说明</div>
          <div style="font-size:14px;color:var(--text-secondary);" data-db="assignment.detail.description">请独立完成，注意规范</div>
        </div>
        <div style="flex:1;text-align:right;">
          <div style="font-size:13px;color:var(--text-secondary);">完成率</div>
          <div style="font-size:24px;font-weight:700;color:var(--primary);" data-db="assignment.detail.completionRate">56%</div>
        </div>
      </div>
    </div>

    <!-- 学生状态一览 -->
    <div class="card">
      <div class="card-title">学生完成情况</div>

      <!-- 筛选 -->
      <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;">
        <span class="sort-pill active" onclick="filterStatus(this, 'all')" style="padding:5px 14px;border:1px solid var(--border);border-radius:20px;font-size:13px;cursor:pointer;background:var(--primary);color:#fff;">全部 <span data-db="assignment.stats.total">32</span></span>
        <span class="sort-pill" onclick="filterStatus(this, 'done')" style="padding:5px 14px;border:1px solid var(--border);border-radius:20px;font-size:13px;cursor:pointer;">已提交 <span data-db="assignment.stats.submitted">18</span></span>
        <span class="sort-pill" onclick="filterStatus(this, 'pending')" style="padding:5px 14px;border:1px solid var(--border);border-radius:20px;font-size:13px;cursor:pointer;">未提交 <span data-db="assignment.stats.pending">14</span></span>
      </div>

      <!-- 学生列表 -->
      <div data-db-loop="assignment.students">
        <a href="student.html?id=1" class="student-row">
          <div class="avatar">王</div>
          <div class="info">
            <div class="name" data-db="assignment.students[].name">王一帆</div>
            <div class="sub" data-db="assignment.students[].subInfo">已提交 · 用时 23min</div>
          </div>
          <div class="score">
            <div class="value high" data-db="assignment.students[].accuracy">88%</div>
            <div class="detail"><span data-db="assignment.students[].correctCount">7</span>/<span data-db="assignment.students[].totalCount">8</span></div>
          </div>
        </a>

        <a href="student.html?id=2" class="student-row">
          <div class="avatar">李</div>
          <div class="info">
            <div class="name" data-db="assignment.students[].name">李明</div>
            <div class="sub" data-db="assignment.students[].subInfo">已提交 · 用时 35min</div>
          </div>
          <div class="score">
            <div class="value mid" data-db="assignment.students[].accuracy">62%</div>
            <div class="detail"><span data-db="assignment.students[].correctCount">5</span>/<span data-db="assignment.students[].totalCount">8</span></div>
          </div>
        </a>

        <a href="student.html?id=3" class="student-row">
          <div class="avatar">陈</div>
          <div class="info">
            <div class="name" data-db="assignment.students[].name">陈思远</div>
            <div class="sub" data-db="assignment.students[].subInfo">已提交 · 用时 18min</div>
          </div>
          <div class="score">
            <div class="value low" data-db="assignment.students[].accuracy">38%</div>
            <div class="detail"><span data-db="assignment.students[].correctCount">3</span>/<span data-db="assignment.students[].totalCount">8</span></div>
          </div>
        </a>

        <a href="student.html?id=4" class="student-row">
          <div class="avatar">赵</div>
          <div class="info">
            <div class="name" data-db="assignment.students[].name">赵雪</div>
            <div class="sub" data-db="assignment.students[].subInfo">已提交 · 用时 40min</div>
          </div>
          <div class="score">
            <div class="value high" data-db="assignment.students[].accuracy">100%</div>
            <div class="detail"><span data-db="assignment.students[].correctCount">8</span>/<span data-db="assignment.students[].totalCount">8</span></div>
          </div>
        </a>

        <a href="student.html?id=5" class="student-row">
          <div class="avatar">刘</div>
          <div class="info">
            <div class="name" data-db="assignment.students[].name">刘浩</div>
            <div class="sub" style="color:var(--text-muted);">未提交</div>
          </div>
          <div class="score">
            <span class="status-tag pending">未交</span>
          </div>
        </a>

        <a href="student.html?id=6" class="student-row">
          <div class="avatar">张</div>
          <div class="info">
            <div class="name" data-db="assignment.students[].name">张雨桐</div>
            <div class="sub" style="color:var(--text-muted);">未提交</div>
          </div>
          <div class="score">
            <span class="status-tag pending">未交</span>
          </div>
        </a>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast-container" id="toast-container">
    <div class="toast-bar" id="toast-bar">
      <span class="toast-icon" id="toast-icon">✅</span>
      <span class="toast-msg" id="toast-msg">操作成功</span>
      <button class="toast-close" onclick="closeToast()">✕</button>
    </div>
  </div>

  <script>
    /* ---- 状态筛选 ---- */
    function filterStatus(el, status) {
      document.querySelectorAll('.sort-pill').forEach(function(p) {
        p.classList.remove('active');
        p.style.background = '';
        p.style.color = '';
      });
      el.classList.add('active');
      el.style.background = 'var(--primary)';
      el.style.color = '#fff';

      // 显示/隐藏学生行（模拟）
      document.querySelectorAll('.student-row').forEach(function(row) {
        var isPending = row.querySelector('.status-tag');
        if (status === 'all') {
          row.style.display = 'flex';
        } else if (status === 'done') {
          row.style.display = isPending ? 'none' : 'flex';
        } else if (status === 'pending') {
          row.style.display = isPending ? 'flex' : 'none';
        }
      });
    }

    /* ---- Toast ---- */
    var _toastTimer = null;
    function showToast(icon, msg, duration) {
      var bar = document.getElementById('toast-bar');
      document.getElementById('toast-icon').textContent = icon;
      document.getElementById('toast-msg').textContent = msg;
      bar.classList.add('show');
      if (duration === undefined) duration = 3000;
      if (_toastTimer) clearTimeout(_toastTimer);
      _toastTimer = setTimeout(function() { bar.classList.remove('show'); }, duration);
    }
    function closeToast() {
      document.getElementById('toast-bar').classList.remove('show');
      if (_toastTimer) clearTimeout(_toastTimer);
    }
  </script>
</body>
</html>
