<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>评分 - 章鱼智学</title>
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="solve.css">
</head>
<body>
  <!-- Flutter 注意：emoji 图标在 Flutter 中已替换为 Material Icon -->
  <div class="page-header">
    <a href="javascript:history.back()" class="back-btn">← 返回</a>
    <h1>题目评分</h1>
  </div>

  <div class="solve-container">
    <div class="question-meta">
      第 <span>3</span> 题　
      <span>导数第 1 讲课后练习</span>
    </div>

    <!-- 难度 -->
    <div class="card rate-section">
      <div class="rate-header">难度</div>
      <div class="rate-compare">算法：<span id="algo-difficulty">6.6</span></div>
      <div class="star-rating" data-dim="difficulty">
        <span class="star" data-value="1" onclick="setRating('difficulty', 1)">★</span>
        <span class="star" data-value="2" onclick="setRating('difficulty', 2)">★</span>
        <span class="star" data-value="3" onclick="setRating('difficulty', 3)">★</span>
        <span class="star" data-value="4" onclick="setRating('difficulty', 4)">★</span>
        <span class="star" data-value="5" onclick="setRating('difficulty', 5)">★</span>
        <span class="star" data-value="6" onclick="setRating('difficulty', 6)">★</span>
        <span class="star" data-value="7" onclick="setRating('difficulty', 7)">★</span>
        <span class="star" data-value="8" onclick="setRating('difficulty', 8)">★</span>
        <span class="star" data-value="9" onclick="setRating('difficulty', 9)">★</span>
        <span class="star" data-value="10" onclick="setRating('difficulty', 10)">★</span>
      </div>
      <div style="font-size:12px;color:var(--text-muted);margin-top:2px;">
        用户评分：<span id="user-difficulty">—</span>
      </div>
    </div>

    <!-- 计算量 -->
    <div class="card rate-section">
      <div class="rate-header">计算量</div>
      <div class="rate-compare">算法：<span id="algo-calculation">6.6</span></div>
      <div class="star-rating" data-dim="calculation">
        <span class="star" data-value="1" onclick="setRating('calculation', 1)">★</span>
        <span class="star" data-value="2" onclick="setRating('calculation', 2)">★</span>
        <span class="star" data-value="3" onclick="setRating('calculation', 3)">★</span>
        <span class="star" data-value="4" onclick="setRating('calculation', 4)">★</span>
        <span class="star" data-value="5" onclick="setRating('calculation', 5)">★</span>
        <span class="star" data-value="6" onclick="setRating('calculation', 6)">★</span>
        <span class="star" data-value="7" onclick="setRating('calculation', 7)">★</span>
        <span class="star" data-value="8" onclick="setRating('calculation', 8)">★</span>
        <span class="star" data-value="9" onclick="setRating('calculation', 9)">★</span>
        <span class="star" data-value="10" onclick="setRating('calculation', 10)">★</span>
      </div>
      <div style="font-size:12px;color:var(--text-muted);margin-top:2px;">
        用户评分：<span id="user-calculation">—</span>
      </div>
    </div>

    <!-- 优雅度 -->
    <div class="card rate-section">
      <div class="rate-header">优雅度</div>
      <div class="star-rating" data-dim="elegance">
        <span class="star" data-value="1" onclick="setRating('elegance', 1)">★</span>
        <span class="star" data-value="2" onclick="setRating('elegance', 2)">★</span>
        <span class="star" data-value="3" onclick="setRating('elegance', 3)">★</span>
        <span class="star" data-value="4" onclick="setRating('elegance', 4)">★</span>
        <span class="star" data-value="5" onclick="setRating('elegance', 5)">★</span>
        <span class="star" data-value="6" onclick="setRating('elegance', 6)">★</span>
        <span class="star" data-value="7" onclick="setRating('elegance', 7)">★</span>
        <span class="star" data-value="8" onclick="setRating('elegance', 8)">★</span>
        <span class="star" data-value="9" onclick="setRating('elegance', 9)">★</span>
        <span class="star" data-value="10" onclick="setRating('elegance', 10)">★</span>
      </div>
      <div style="font-size:12px;color:var(--text-muted);margin-top:2px;">
        用户评分：<span id="user-elegance">—</span>
      </div>
    </div>

    <button class="btn btn-primary btn-block" onclick="submitRating()">
      提交评分（可获得 +0.3 赠送积分）
    </button>
  </div>

  <!-- Toast -->
  <div class="toast-container"><div class="toast-bar" id="toast-bar"><span class="toast-icon" id="toast-icon"></span><span class="toast-msg" id="toast-msg"></span><button class="toast-close" onclick="closeToast()">✕</button></div></div>

  <script src="solve-utils.js"></script>
  <script>
  function submitRating() {
    var hasAny = currentRating.difficulty > 0 || currentRating.calculation > 0 || currentRating.elegance > 0;
    if (!hasAny) {
      showToast('⚠️', '请至少给一个维度评分');
      return;
    }
    showToast('✅', '评分已提交，+0.3 赠送积分');
    // Flutter 中调用 API 提交评分
  }
  </script>
</body>
</html>
