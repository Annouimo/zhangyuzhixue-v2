<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学习偏好管理 - 章鱼智学</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Flutter 注意：📋 等图标在 Flutter 中已替换为 Material Icon -->
  <div class="page-header">
    <a href="javascript:history.back()" class="back-btn">← 返回</a>
    <h1>学习偏好管理</h1>
  </div>

  <div class="page" style="padding-top:8px;">
    <div data-db-loop="preference.list" data-db-empty="暂无学习偏好，快去创建一个吧">
      <div class="card">
        <div class="flex items-center justify-between">
          <div>
            <div style="font-size:15px;font-weight:600;" data-db="preference.list[].name">📋 导数专项</div>
            <div class="text-secondary" style="font-size:12px;margin-top:2px;" data-db="preference.list[].summary">
              2025 海淀/东城 · 导数 · 难度 2-8
            </div>
          </div>
        </div>
        <div class="paper-actions mt-2" style="display:flex;gap:8px;">
          <a href="preference_edit.html" class="btn btn-outline btn-sm" data-db-action="preference.edit(1)">编辑</a>
          <button class="btn btn-ghost btn-sm" style="color:var(--error);" data-db-action="preference.delete(1)">删除</button>
        </div>
      </div>

      <div class="card">
        <div class="flex items-center justify-between">
          <div>
            <div style="font-size:15px;font-weight:600;" data-db="preference.list[].name">📋 三角函数训练</div>
            <div class="text-secondary" style="font-size:12px;margin-top:2px;" data-db="preference.list[].summary">
              2024-2025 海淀 · 三角函数 · 难度 3-9
            </div>
          </div>
        </div>
        <div class="paper-actions mt-2" style="display:flex;gap:8px;">
          <a href="preference_edit.html" class="btn btn-outline btn-sm" data-db-action="preference.edit(2)">编辑</a>
          <button class="btn btn-ghost btn-sm" style="color:var(--error);" data-db-action="preference.delete(2)">删除</button>
        </div>
      </div>
    </div>

    <a href="preference_edit.html" class="btn btn-primary btn-block mt-4" style="display:block;text-align:center;">
      ＋ 新建偏好
    </a>
  </div>
</body>
</html>
