<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>编辑偏好 - 章鱼智学</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page-header">
    <a href="javascript:history.back()" class="back-btn">← 返回</a>
    <h1>编辑偏好</h1>
  </div>

  <div class="page" style="padding-top:8px;">
    <!-- 偏好名称 -->
    <div class="input-group">
      <label>偏好名称</label>
      <input type="text" placeholder="给偏好取个名字" data-db-bind="preference.edit.name" value="导数专项">
    </div>

    <!-- 筛选条件 -->
    <div class="card">
      <div style="font-size:15px;font-weight:600;margin-bottom:12px;">筛选条件</div>

      <div class="filter-section">
        <div class="filter-header" onclick="toggleFilter(this)">
          <span>按来源筛选</span>
          <span>▾</span>
        </div>
        <div class="filter-body">
          <div class="mb-4">
            <label style="font-size:13px;font-weight:500;display:block;margin-bottom:4px;">年份</label>
            <div class="flex gap-2" data-db-loop="preference.edit.filter.years">
              <label style="font-size:13px;"><input type="checkbox" checked> 2025</label>
              <label style="font-size:13px;"><input type="checkbox"> 2024</label>
              <label style="font-size:13px;"><input type="checkbox"> 2023</label>
            </div>
          </div>
          <div>
            <label style="font-size:13px;font-weight:500;display:block;margin-bottom:4px;">地区</label>
            <div class="flex gap-2" data-db-loop="preference.edit.filter.regions">
              <label style="font-size:13px;"><input type="checkbox" checked> 海淀</label>
              <label style="font-size:13px;"><input type="checkbox" checked> 东城</label>
              <label style="font-size:13px;"><input type="checkbox"> 西城</label>
              <label style="font-size:13px;"><input type="checkbox"> 朝阳</label>
            </div>
          </div>
          <div class="mt-2">
            <label style="font-size:13px;font-weight:500;display:block;margin-bottom:4px;">考试</label>
            <div class="flex gap-2">
              <label style="font-size:13px;"><input type="checkbox" checked> 一模</label>
              <label style="font-size:13px;"><input type="checkbox"> 二模</label>
              <label style="font-size:13px;"><input type="checkbox"> 期末</label>
            </div>
          </div>
        </div>
      </div>

      <div class="filter-section">
        <div class="filter-header" onclick="toggleFilter(this)">
          <span>按概念标签筛选</span>
          <span>▾</span>
        </div>
        <div class="filter-body">
          <p class="text-secondary" style="font-size:13px;" data-db-loop="preference.edit.filter.conceptTags">
            <label style="display:inline-block;margin-right:8px;margin-bottom:4px;font-size:13px;"><input type="checkbox"> 集合</label>
            <label style="display:inline-block;margin-right:8px;margin-bottom:4px;font-size:13px;"><input type="checkbox"> 函数</label>
            <label style="display:inline-block;margin-right:8px;margin-bottom:4px;font-size:13px;"><input type="checkbox"> 导数</label>
            <label style="display:inline-block;margin-right:8px;margin-bottom:4px;font-size:13px;"><input type="checkbox"> 三角函数</label>
            <label style="display:inline-block;margin-right:8px;margin-bottom:4px;font-size:13px;"><input type="checkbox"> 数列</label>
          </p>
        </div>
      </div>

      <div class="filter-section">
        <div class="filter-header" onclick="toggleFilter(this)">
          <span>按知识卡片筛选</span>
          <span>▾</span>
        </div>
        <div class="filter-body">
          <p class="text-secondary" style="font-size:13px;" data-db-loop="preference.edit.filter.knowledgeCards">
            <label style="display:block;margin-bottom:4px;font-size:13px;">
              <input type="checkbox"> 正弦定理</label>
            <label style="display:block;margin-bottom:4px;font-size:13px;">
              <input type="checkbox"> 余弦定理</label>
            <label style="display:block;margin-bottom:4px;font-size:13px;">
              <input type="checkbox"> 辅助角公式</label>
          </p>
        </div>
      </div>

      <div class="filter-section">
        <div class="filter-header" onclick="toggleFilter(this)">
          <span>按难度/计算量筛选</span>
          <span>▾</span>
        </div>
        <div class="filter-body">
          <!-- 难度 -->
          <div class="mb-4">
            <div style="font-size:13px;font-weight:500;margin-bottom:2px;">难度</div>
            <div class="dual-range" id="edit-difficulty-range">
              <div class="rail" id="edit-difficulty-rail"></div>
              <div class="fill" id="edit-difficulty-fill"></div>
              <input type="range" min="0" max="10" value="2" step="0.5"
                     id="edit-difficulty-min" oninput="syncDualRange('edit-difficulty')">
              <input type="range" min="0" max="10" value="8" step="0.5"
                     id="edit-difficulty-max" oninput="syncDualRange('edit-difficulty')">
            </div>
            <div class="dual-marks" id="edit-difficulty-marks">
              <span class="tick" style="left:30%;"></span>
              <span class="tick" style="left:50%;"></span>
              <span class="tick" style="left:70%;"></span>
              <span class="tick" style="left:85%;"></span>
              <span class="label" style="left:15%;">基础</span>
              <span class="label" style="left:40%;">中档</span>
              <span class="label" style="left:60%;">中难</span>
              <span class="label" style="left:77.5%;">较难</span>
              <span class="label" style="left:92.5%;">压轴</span>
            </div>
            <div class="dual-desc" id="edit-difficulty-desc"></div>
          </div>
          <!-- 计算量 -->
          <div>
            <div style="font-size:13px;font-weight:500;margin-bottom:2px;">计算量</div>
            <div class="dual-range" id="edit-calculation-range">
              <div class="rail" id="edit-calculation-rail"></div>
              <div class="fill" id="edit-calculation-fill"></div>
              <input type="range" min="0" max="10" value="1" step="0.5"
                     id="edit-calculation-min" oninput="syncDualRange('edit-calculation')">
              <input type="range" min="0" max="10" value="7" step="0.5"
                     id="edit-calculation-max" oninput="syncDualRange('edit-calculation')">
            </div>
            <div class="dual-marks" id="edit-calculation-marks">
              <span class="tick" style="left:20%;"></span>
              <span class="tick" style="left:40%;"></span>
              <span class="tick" style="left:60%;"></span>
              <span class="tick" style="left:80%;"></span>
              <span class="label" style="left:10%;">少量</span>
              <span class="label" style="left:30%;">较少</span>
              <span class="label" style="left:50%;">适中</span>
              <span class="label" style="left:70%;">较多</span>
              <span class="label" style="left:90%;">繁琐</span>
            </div>
            <div class="dual-desc" id="edit-calculation-desc"></div>
          </div>
        </div>
      </div>
    </div>

    <button class="btn btn-primary btn-block" data-db-action="preference.edit.save()"
            onclick="location.href='preference_list.html'">
      保存
    </button>
  </div>

  <script>
    function toggleFilter(header) {
      header.parentElement.classList.toggle('open');
    }

    var DIFFICULTY_SEGMENTS = [
      {max: 3.0, label: '基础', sample: '单选1-3·填空11·解答第一问'},
      {max: 5.0, label: '中档', sample: '单选4-6·填空12-13·常规解答'},
      {max: 7.0, label: '中难', sample: '选填后半·填空14·解答多步推理'},
      {max: 8.5, label: '较难', sample: '选填压轴·解答最后两问'},
      {max: 10.0, label: '压轴', sample: '解答压轴问·创新综合题'}
    ];
    var WORKLOAD_SEGMENTS = [
      {max: 2.0, label: '少量', sample: '心算即可，不需动笔'},
      {max: 4.0, label: '较少', sample: '简单代入化简，2-3步'},
      {max: 6.0, label: '适中', sample: '常规运算量，需完整步骤'},
      {max: 8.0, label: '较多', sample: '多步代数运算，需仔细'},
      {max: 10.0, label: '繁琐', sample: '大量代数变换，需耐心推导'}
    ];

    function getSegment(segments, value) {
      for (var i = 0; i < segments.length; i++) {
        if (value <= segments[i].max) return {index: i, data: segments[i]};
      }
      return {index: segments.length - 1, data: segments[segments.length - 1]};
    }

    function syncDualRange(name) {
      var minInput = document.getElementById(name + '-min');
      var maxInput = document.getElementById(name + '-max');
      if (!minInput || !maxInput) return;
      var minVal = parseFloat(minInput.value);
      var maxVal = parseFloat(maxInput.value);
      if (minVal > maxVal) {
        var tmp = minVal; minVal = maxVal; maxVal = tmp;
        minInput.value = minVal; maxInput.value = maxVal;
      }

      var totalMin = parseFloat(minInput.min);
      var totalMax = parseFloat(minInput.max);
      var range = totalMax - totalMin;
      var fill = document.getElementById(name + '-fill');
      if (fill) {
        fill.style.left = ((minVal - totalMin) / range * 100) + '%';
        fill.style.width = ((maxVal - minVal) / range * 100) + '%';
      }

      var descEl = document.getElementById(name + '-desc');
      if (!descEl) return;
      var segments = name.indexOf('difficulty') !== -1 ? DIFFICULTY_SEGMENTS : WORKLOAD_SEGMENTS;

      var minSeg = getSegment(segments, minVal);
      var maxSeg = getSegment(segments, maxVal);

      var html = '';
      if (minSeg.index === maxSeg.index) {
        html += '<div class="seg-line">';
        html += '<span class="seg-arrow"></span>';
        html += '<span class="seg-name">' + minSeg.data.label + '</span>';
        html += '<span class="seg-samples">' + minSeg.data.sample + '</span>';
        html += '</div>';
      } else {
        html += '<div class="seg-line">';
        html += '<span class="seg-arrow">\u2190</span>';
        html += '<span class="seg-name">' + minSeg.data.label + '</span>';
        html += '<span class="seg-samples">' + minSeg.data.sample + '</span>';
        html += '</div>';
        html += '<div class="seg-line">';
        html += '<span class="seg-arrow">\u2192</span>';
        html += '<span class="seg-name">' + maxSeg.data.label + '</span>';
        html += '<span class="seg-samples">' + maxSeg.data.sample + '</span>';
        html += '</div>';
      }
      descEl.innerHTML = html;
    }

    window.onload = function() {
      syncDualRange('edit-difficulty');
      syncDualRange('edit-calculation');
    };
  </script>
</body>
</html>
