version: '1.0'
name: zhangyuzhixue-ci
displayName: zhangyuzhixue-ci
triggers:
  trigger: auto
  push:
    branches:
      prefix:
        - ''
stages:
  - name: flutter-check
    displayName: flutter-check
    steps:
      - step: shell
        displayName: dart analyze
        inputs:
          command: dart analyze
          workDir: flutter_app
      - step: shell
        displayName: flutter test
        inputs:
          command: flutter test
          workDir: flutter_app

  - name: django-check
    displayName: django-check
    steps:
      - step: shell
        displayName: install deps
        inputs:
          command: pip install -r requirements.txt -q
          workDir: server
      - step: shell
        displayName: flake8
        inputs:
          command: flake8 --config .flake8 server/
          workDir: .
      - step: shell
        displayName: check --deploy
        inputs:
          command: python manage.py check --deploy
          workDir: server
      - step: shell
        displayName: makemigrations --check
        inputs:
          command: python manage.py makemigrations --check
          workDir: server
