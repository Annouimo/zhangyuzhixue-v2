name: teacher_app
description: "个性定制高考数学智能学习系统 - 教师端"
publish_to: 'none'
version: 1.1.0+3

# The teacher app is internal-only but follows the student app build baseline.
release_channel: beta
release_iteration: 3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Shared component library (student + teacher)
  shared:
    path: ../packages/shared

  # Local database
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.0

  # HTTP client for DB updates
  dio: ^5.7.0

  # UI & Markdown & LaTeX
  flutter_markdown_plus: ^1.0.7
  flutter_math_fork: ^0.7.3
  markdown: ^7.2.0
  url_launcher: ^6.3.0

  # Crypto for checksum verification
  crypto: ^3.0.0

  # Storage
  shared_preferences: ^2.3.0
  path_provider: ^2.1.0

  # Annotations
  meta: ^1.15.0

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.0
  msix: ^3.18.0

msix_config:
  display_name: 章鱼智学 · 教师端
  publisher_display_name: 章鱼智学
  identity_name: com.zhangyuzhixue.teacher
  logo_path: windows/runner/resources/app_icon.ico
  install_certificate: true

flutter:
  uses-material-design: true
  assets:
    - assets/db/
    - assets/questions/images/
