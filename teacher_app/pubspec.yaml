name: teacher_app
description: "章鱼智学 v2 - 教师端（题库浏览 + 讲义阅读 + 选题导出）"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Local database
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.0

  # HTTP client for DB updates
  dio: ^5.7.0

  # UI & Markdown & LaTeX
  flutter_markdown_plus: ^1.0.7
  flutter_math_fork: ^0.7.3
  markdown: ^7.2.0
  url_launcher: ^6.3.0

  # Crypto for checksum verification
  crypto: ^3.0.0

  # Storage
  shared_preferences: ^2.3.0
  path_provider: ^2.1.0

  # Annotations
  meta: ^1.15.0

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/db/
