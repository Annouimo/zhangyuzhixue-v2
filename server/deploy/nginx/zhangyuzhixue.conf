# HTTP to HTTPS redirect
server {
    listen 80;
    server_name zhangyuzhixue.zhtec123.com zhangyuzhixue.top;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

# HTTPS - zhangyuzhixue.top (full site)
server {
    listen 443 ssl;
    server_name zhangyuzhixue.top;
    ssl_certificate     /etc/letsencrypt/live/zhangyuzhixue.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zhangyuzhixue.top/privkey.pem;
    client_max_body_size 50M;
    error_page 404 /404.html;
    location / { root /opt/zhangyuzhixue-v2/landing; try_files $uri $uri/ =404; }
    location /teacher/ { alias /opt/zhangyuzhixue-v2/landing/teacher/; }
    location /static/ { alias /opt/zhangyuzhixue-v2/server/staticfiles/; expires 7d; add_header Cache-Control "public, immutable"; }
    location /media/ { alias /opt/zhangyuzhixue-v2/server/media/; }
    location /api/ { proxy_pass http://127.0.0.1:8001; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; proxy_read_timeout 120s; }
    location /admin/ { proxy_pass http://127.0.0.1:8001; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }
    location /pdf/ { proxy_pass http://127.0.0.1:8001; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }
    location = /privacy.html { root /opt/zhangyuzhixue-v2/landing; }
    location = /terms.html   { root /opt/zhangyuzhixue-v2/landing; }
}

# HTTPS - zhangyuzhixue.zhtec123.com (privacy + terms only)
server {
    listen 443 ssl;
    server_name zhangyuzhixue.zhtec123.com;
    ssl_certificate     /etc/letsencrypt/live/zhangyuzhixue.zhtec123.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zhangyuzhixue.zhtec123.com/privkey.pem;
    client_max_body_size 50M;
    location = /privacy.html { root /opt/zhangyuzhixue-v2/landing; }
    location = /terms.html   { root /opt/zhangyuzhixue-v2/landing; }
    location /assets/ { root /opt/zhangyuzhixue-v2/landing; }
    location /teacher/ { alias /opt/zhangyuzhixue-v2/landing/teacher/; }
    location /static/ { alias /opt/zhangyuzhixue-v2/server/staticfiles/; expires 7d; }
    location /media/ { alias /opt/zhangyuzhixue-v2/server/media/; }
    location /api/ { proxy_pass http://127.0.0.1:8001; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; proxy_read_timeout 120s; }
    location /admin/ { proxy_pass http://127.0.0.1:8001; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }
    location /pdf/ { proxy_pass http://127.0.0.1:8001; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }
    location / { return 404; }
}

