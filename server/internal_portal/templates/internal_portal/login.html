{% load static %}
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>登录 | 项目工作手册</title>
  <link rel="stylesheet" href="{% static 'internal_portal/portal.css' %}?v=3">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-panel" aria-labelledby="login-title">
      <a class="login-brand" href="/">
        <span class="brand__mark">章</span>
        <span>章鱼智学</span>
      </a>
      <p class="eyebrow">团队内部</p>
      <h1 id="login-title">登录项目工作手册</h1>
      <p class="login-intro">使用团队账号查看当前项目情况、必要资料和协作入口。</p>

      <form method="post" class="login-form">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        {% if form.non_field_errors %}
          <div class="form-error" role="alert">{{ form.non_field_errors.0 }}</div>
        {% endif %}
        <label for="id_username">账号</label>
        <input id="id_username" name="username" type="text" autocomplete="username" required autofocus value="{{ form.username.value|default:'' }}">
        <label for="id_password">密码</label>
        <input id="id_password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit" class="primary-button">登录</button>
      </form>
      <a class="back-link" href="/">返回章鱼智学官网</a>
    </section>
  </main>
</body>
</html>
