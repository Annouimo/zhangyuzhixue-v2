name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  flutter:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44'
          channel: 'stable'
          cache: true
      - name: flutter pub get
        working-directory: flutter_app
        run: flutter pub get
      - name: dart analyze
        working-directory: flutter_app
        run: dart analyze
      - name: flutter test
        working-directory: flutter_app
        run: flutter test

  django:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        working-directory: server
        run: pip3 install -r requirements.txt -q
      - name: flake8
        working-directory: server
        run: pip3 install flake8 -q && flake8 --config .flake8
      - name: Django checks
        working-directory: server
        run: |
          python3 manage.py check --deploy
          python3 manage.py makemigrations --check
