name: flutter_app
description: "个性定制高考数学智能学习系统 - Flutter 学生端"
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Shared component library (student + teacher)
  shared:
    path: ../packages/shared

  # Local database
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.0

  # HTTP client
  dio: ^5.7.0
  dio_smart_retry: ^7.0.0

  # UI & Markdown
  flutter_markdown_plus: ^1.0.7
  flutter_math_fork: ^0.7.3
  markdown: ^7.2.0
  url_launcher: ^6.3.0
  cached_network_image: ^3.4.0
  crypto: ^3.0.0

  # State management & storage
  flutter_riverpod: ^2.6.0
  shared_preferences: ^2.3.0
  path_provider: ^2.1.0

  # Annotations
  meta: ^1.15.0

  # Network
  connectivity_plus: ^6.1.0

  # Icons
  cupertino_icons: ^1.0.8
  go_router: ^17.3.0

  # Image picker
  image_picker: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.0
  msix: ^3.18.0

msix_config:
  display_name: 章鱼智学
  publisher_display_name: Annouimo
  publisher: "CN=4B0BC5E2-DDB8-4E00-8A70-1D231234C993"
  identity_name: Annouimo.526026C9DD952
  logo_path: windows/runner/resources/app_icon.ico
  store: true
  install_certificate: false

flutter:
  uses-material-design: true
  assets:
    - assets/db/
    - assets/questions/images/
    - assets/logo_mark.png
    - assets/logo_mark_white.png
