<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <meta property="og:title" content="章鱼智学 — 北京高考数学 · 智能练习">
  <meta property="og:description" content="798 道北京高考真题，智能难度推荐，解题步骤逐卡引导。学生 App + 教师 Web 双端协作。">
</head>
<body>

<div class="container">

  <!-- 顶部栏 -->
  <div class="top-bar">
    <span class="brand">🐙 章鱼智学</span>
    <a href="teacher/login.html" class="teacher-link">教师登录 →</a>
  </div>

  <!-- Hero -->
  <div class="hero">
    <h1>章鱼智学</h1>
    <p class="subtitle">北京高考数学 · 千题库 · 智能推荐</p>
  </div>

  <!-- 下载区域：JS 自动高亮当前设备版本 -->
  <div class="download-group" id="download-group">
    <a href="https://gitee.com/annouimo/zhangyuzhixue-v2/releases/download/v1.0.0-alpha1/student-alpha1.apk" class="btn-download" data-platform="android">
      <span class="dl-icon">📱</span>
      <span class="dl-text">
        <span class="dl-title">Android 版</span>
        <span class="dl-desc">APK 直接安装</span>
      </span>
    </a>
    <a href="#" class="btn-download" data-platform="ios">
      <span class="dl-icon">🍎</span>
      <span class="dl-text">
        <span class="dl-title">iOS 版</span>
        <span class="dl-desc">即将上线</span>
      </span>
    </a>
    <a href="https://gitee.com/annouimo/zhangyuzhixue-v2/releases/download/v1.0.0-alpha1/%E7%AB%A0%E9%B1%BC%E6%99%BA%E5%AD%A6-alpha1.exe" class="btn-download" data-platform="windows" id="win-download">
      <span class="dl-icon">💻</span>
      <span class="dl-text">
        <span class="dl-title">Windows 版</span>
        <span class="dl-desc">Setup 安装包</span>
      </span>
    </a>
  </div>

  <!-- 备用下载 -->
  <div class="backup-dl">
    <span>☁️ 备用下载：</span>
    <a href="https://pan.baidu.com/s/1vFe6MaYHI3b8tGQMOaOh3Q?pwd=6bjf" target="_blank" rel="noopener">百度网盘</a>
    <span class="backup-code">提取码 6bjf</span>

  <!-- 联系方式 -->
  <div class="card">
    <div class="card-title">联系方式</div>
    <img class="qr-img" src="images/wechat-qr.jpg" alt="微信二维码">

<!-- iOS 弹窗 -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-card">
    <button class="modal-close" id="modal-close">&times;</button>
    <div class="modal-icon">🚧</div>
    <div class="modal-title">iOS 版尚未就绪</div>
    <p class="modal-body">
      我们正在准备 iOS 版本，<br>
      请先用 Android 或 Windows 版体验。
    </p>
    <button class="btn btn-confirm" id="modal-confirm">知道了</button>
  </div>
</div>

<script>
;(function() {
  var ua = navigator.userAgent.toLowerCase()
  var platform = 'android'
  if (/iphone|ipad|ipod/.test(ua)) platform = 'ios'
  else if (/windows/.test(ua)) platform = 'windows'

  var btns = document.querySelectorAll('.btn-download')
  var activeEl = null
  btns.forEach(function(b) {
    if (b.dataset.platform === platform) {
      b.classList.add('active')
      activeEl = b
    } else {
      b.classList.add('inactive')
    }
  })

  // 把非活跃按钮移到"其他平台"行
  var group = document.getElementById('download-group')
  var inactives = group.querySelectorAll('.btn-download.inactive')
  if (inactives.length > 0 && activeEl) {
    var wrap = document.createElement('div')
    wrap.style.cssText = 'display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:center;'

    var label = document.createElement('span')
    label.className = 'dl-others-label'
    label.textContent = '其他平台：'
    wrap.appendChild(label)

    Array.from(inactives).forEach(function(b, i) {
      if (i > 0) {
        var sep = document.createElement('span')
        sep.textContent = '·'
        sep.style.cssText = 'color:var(--text-muted);font-size:12px;'
        wrap.appendChild(sep)
      }
      wrap.appendChild(b)
    })

    group.appendChild(wrap)
  }

  // iOS 弹窗逻辑
  var iosBtn = document.querySelector('[data-platform="ios"]')
  var modal = document.getElementById('modal-overlay')
  var confirmBtn = document.getElementById('modal-confirm')
  var closeBtn = document.getElementById('modal-close')

  function showModal(e) {
    e.preventDefault()
    modal.classList.add('open')
  }

  function hideModal() {
    modal.classList.remove('open')
  }

  iosBtn.addEventListener('click', showModal)
  confirmBtn.addEventListener('click', hideModal)
  closeBtn.addEventListener('click', hideModal)
  modal.addEventListener('click', function(e) {
    if (e.target === modal) hideModal()
  })
})()
</script>

</body>
</html>
