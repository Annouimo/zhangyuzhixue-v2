<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发布作业 — 章鱼智学 · 教师端</title>
  <link rel="stylesheet" href="teacher-styles.css">
</head>
<body class="has-header">
  <header class="top-header">
    <div class="header-inner">
      <a href="index.html" class="brand">🐙 章鱼智学</a>
      <nav class="nav-links">
        <a href="index.html">作业</a>
        <a href="classes.html">班级</a>
        <a href="students.html">学生</a>
        <a href="about.html">关于</a>
      </nav>
      <div class="user-info">
        <span class="username" id="header-username">教师</span>
        <a href="login.html" style="font-size:13px;color:var(--text-muted);text-decoration:none;margin-left:8px;" onclick="handleLogout(); return false;">退出</a>
      </div>
    </div>
  </header>

  <div class="container" style="max-width:640px;">
    <div class="page-header">
      <a href="index.html" style="font-size:14px;color:var(--primary);text-decoration:none;">← 返回作业列表</a>
      <h1>发布作业</h1>
    </div>

    <div id="error-msg" class="error-banner"></div>

    <!-- 步骤 1: 粘贴选题 JSON -->
    <div class="card">
      <div class="card-title">① 粘贴选题</div>
      <p style="font-size:13px;color:var(--text-secondary);margin-bottom:8px;">
        从教师 Flutter App 中选题并导出 JSON，粘贴到下方输入框中：
      </p>
      <textarea id="json-input" rows="4" style="width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:monospace;resize:vertical;box-sizing:border-box;" placeholder='{"version":1,"questionIds":[101,205,378],"selectedAt":"2026-07-15T10:30:00","totalCount":3}'></textarea>
      <div id="json-preview" style="margin-top:8px;font-size:13px;color:var(--text-secondary);"></div>
      <button id="json-parse-btn" class="btn btn-sm" style="margin-top:8px;" onclick="parseJsonInput()">解析</button>
    </div>

    <!-- 步骤 2: 填写信息 -->
    <div class="card">
      <div class="card-title">② 作业信息</div>
      <div class="input-group">
        <label for="title">标题</label>
        <input type="text" id="title" placeholder="作业标题（可选）">
      </div>
      <div class="input-group">
        <label for="deadline">截止日期</label>
        <input type="date" id="deadline" required>
      </div>
      <div class="input-group">
        <label for="description">说明（可选）</label>
        <textarea id="description" rows="2" placeholder="作业说明或备注"></textarea>
      </div>
    </div>

    <!-- 步骤 3: 选课程 -->
    <div class="card">
      <div class="card-title">③ 关联课程</div>
      <div id="course-loading" class="text-center" style="padding:16px;color:var(--text-muted);">加载课程列表...</div>
      <div id="course-list"></div>
    </div>

    <!-- 发布按钮 -->
    <button id="publish-btn" class="btn btn-primary btn-block btn-lg" onclick="handlePublish()">确认发布</button>
  </div>

  <script src="teacher-common.js"></script>
  <script>
    initPage();

    let parsedQuestionIds = null;

    window.parseJsonInput = function() {
      const raw = document.getElementById('json-input').value.trim();
      const preview = document.getElementById('json-preview');
      const btn = document.getElementById('json-parse-btn');
      if (!raw) { preview.innerHTML = '<span style="color:var(--error);">请输入 JSON</span>'; return; }
      try {
        const data = JSON.parse(raw);
        if (!data.questionIds || !Array.isArray(data.questionIds) || data.questionIds.length === 0) {
          preview.innerHTML = '<span style="color:var(--error);">JSON 格式错误：缺少 questionIds 数组</span>';
          return;
        }
        parsedQuestionIds = data.questionIds;
        // 显示题号预览（前 10 个 + "等 N 题"）
        var previewIds = data.questionIds.slice(0, 10);
        var previewText = '✅ 解析成功，共 ' + data.questionIds.length + ' 题';
        if (data.selectedAt) previewText += ' · 选中时间: ' + data.selectedAt.slice(0, 10);
        previewText += '<br><span style="font-size:12px;color:var(--text-muted);">题号: ' + previewIds.join(', ');
        if (data.questionIds.length > 10) previewText += ', … 等 ' + (data.questionIds.length - 10) + ' 题';
        previewText += '</span>';
        preview.innerHTML = previewText;
        // 自动填充标题
        const titleInput = document.getElementById('title');
        if (!titleInput.value.trim()) {
          titleInput.value = '作业（' + data.questionIds.length + '题）';
        }
        btn.textContent = '已解析 ✓';
        btn.disabled = true;
      } catch (e) {
        preview.innerHTML = '<span style="color:var(--error);">JSON 解析失败：' + esc(e.message) + '</span>';
        parsedQuestionIds = null;
        btn.disabled = false;
        btn.textContent = '解析';
      }
    };

    window.selectCourse = function(el, id) {
      document.querySelectorAll('#course-list .paper-card').forEach(function(p) { p.classList.remove('selected'); });
      el.classList.add('selected');
    };

    window.handlePublish = async function() {
      hideError();
      if (!parsedQuestionIds || parsedQuestionIds.length === 0) {
        showError('请先粘贴并解析选题 JSON'); return;
      }
      const deadline = document.getElementById('deadline').value;
      if (!deadline) { showError('请选择截止日期'); return; }
      const selectedCourse = document.querySelector('#course-list .paper-card.selected');
      if (!selectedCourse) { showError('请先选择一个课程'); return; }

      const btn = document.getElementById('publish-btn');
      btn.disabled = true; btn.textContent = '发布中...';

      const courseId = parseInt(selectedCourse.dataset.courseId);

      try {
        await apiCall('/teacher/assignments/', {
          method: 'POST',
          body: JSON.stringify({
            question_ids: parsedQuestionIds,
            title: document.getElementById('title').value.trim(),
            deadline: deadline,
            description: document.getElementById('description').value.trim(),
            course_id: courseId,
          }),
        });
        window.location.href = '/teacher/';
      } catch (e) {
        showError('发布失败: ' + e.message);
        btn.disabled = false; btn.textContent = '确认发布';
      }
    };

    // 加载课程
    (async function loadCourses() {
      // 设置截止日期默认值（7 天后）
      var defaultDate = new Date();
      defaultDate.setDate(defaultDate.getDate() + 7);
      document.getElementById('deadline').value = defaultDate.toISOString().slice(0, 10);

      try {
        const courses = await apiCall('/lectures/courses/');
        hideLoading('course-loading');
        const courseContainer = document.getElementById('course-list');
        if (!courses || courses.length === 0) {
          courseContainer.innerHTML = '<div class="text-center" style="padding:12px;color:var(--text-muted);font-size:13px;">暂无课程数据</div>';
        } else {
          courseContainer.innerHTML = courses.map(c => `
            <div class="paper-card" onclick="selectCourse(this, ${c.id})" data-course-id="${c.id}">
              <div class="radio"></div>
              <div class="info">
                <div class="name">${esc(c.name)}</div>
              </div>
            </div>`).join('');
        }
      } catch (e) {
        hideLoading('course-loading');
        document.getElementById('course-list').innerHTML = '<div class="text-center" style="padding:12px;color:var(--text-muted);font-size:13px;">加载失败</div>';
      }
    })();

  </script>
</body>
</html>
