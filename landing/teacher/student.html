<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学生详情 — 章鱼智学 · 教师端</title>
  <link rel="stylesheet" href="teacher-styles.css?v=2">
</head>
<body class="has-header">
  <header class="top-header">
    <div class="header-inner">
      <a href="index.html" class="brand"><img src="../images/logo-mark-24.png" alt="" class="brand-icon"> 章鱼智学</a>
      <nav class="nav-links">
        <a href="index.html">作业</a>
        <a href="classes.html">班级</a>
        <a href="students.html" class="active">学生</a>
        <a href="about.html">关于</a>
      </nav>
      <div class="user-info">
        <span class="username" id="header-username">教师</span>
        <a href="login.html" style="font-size:13px;color:var(--text-muted);text-decoration:none;margin-left:8px;" onclick="handleLogout(); return false;">退出</a>
      </div>
    </div>
  </header>

  <div class="container">
    <div id="error-msg" class="error-banner"></div>
    <div id="loading-indicator" class="text-center" style="padding:40px;color:var(--text-muted);">加载中...</div>

    <div id="content" style="display:none;">
      <!-- 个人信息头 -->
      <div class="page-header">
        <a href="javascript:history.back()" class="btn btn-ghost" style="text-decoration:none;">← 返回</a>
        <div style="display:flex;align-items:center;gap:12px;">
          <div class="avatar" style="width:40px;height:40px;font-size:18px;" id="student-avatar">?</div>
          <div>
            <h1 id="student-name">加载中</h1>
            <div style="font-size:13px;color:var(--text-muted);" id="student-id"></div>
            <div style="font-size:12px;color:var(--text-muted);margin-top:2px;">
              <span id="student-school"></span>
              <span style="margin:0 6px;">·</span>
              <span id="student-registered"></span>
            </div>
          </div>
        </div>
        <div>
          <span class="status-tag" style="background:var(--primary-light);color:var(--primary);" id="student-class"></span>
        </div>
      </div>

      <!-- 概览卡片 -->
      <div class="stats-row">
        <div class="stat-card"><div class="stat-value" id="ov-total-questions">—</div><div class="stat-label">总做题量</div></div>
        <div class="stat-card"><div class="stat-value" style="color:var(--success)" id="ov-accuracy">—</div><div class="stat-label">总正确率</div></div>
        <div class="stat-card"><div class="stat-value" id="ov-streak">—</div><div class="stat-label">连续签到</div></div>
        <div class="stat-card"><div class="stat-value" style="color:var(--primary)" id="ov-weekly">—</div><div class="stat-label">本周做题</div></div>
      </div>

      <!-- 正确率趋势（SVG 折线图） -->
      <div class="card">
        <div class="card-title">正确率趋势（近 30 天）</div>
        <div id="trend-chart" style="min-height:200px;overflow-x:auto;">
          <div class="text-center" style="padding:40px;color:var(--text-muted);font-size:13px;">暂无趋势数据</div>
        </div>
      </div>

      <!-- 薄弱知识点 -->
      <div class="card">
        <div class="card-title">薄弱知识点</div>
        <div id="weak-tags">
          <div class="text-center" style="padding:12px;color:var(--text-muted);font-size:13px;">暂无薄弱知识点数据</div>
        </div>
      </div>

      <!-- 各题型表现 -->
      <div class="card">
        <div class="card-title">各题型表现</div>
        <div id="type-breakdown">
          <div class="text-center" style="padding:12px;color:var(--text-muted);font-size:13px;">暂无题型数据</div>
        </div>
      </div>
    </div>
  </div>

  <script src="teacher-common.js"></script>
  <script>
    initPage();

    function getParam(name) {
      return new URLSearchParams(window.location.search).get(name);
    }

    /** SVG 折线图 — 自适应宽度，固定高度 200px */
    function renderTrendSvg(data) {
      if (!data || data.length === 0) {
        return '<div class="text-center" style="padding:40px;color:var(--text-muted);font-size:13px;">暂无趋势数据</div>';
      }
      const count = data.length;
      const w = Math.max(count * 50, 300);
      const h = 200;
      const pad = { top: 16, right: 16, bottom: 28, left: 40 };
      const iw = w - pad.left - pad.right;
      const ih = h - pad.top - pad.bottom;

      const vals = data.map(d => d.accuracy);
      const maxV = Math.max(...vals, 100);
      const minV = Math.min(...vals, 0);
      const range = Math.max(maxV - minV, 10);

      const points = data.map((d, i) => {
        const x = pad.left + (count > 1 ? (i / (count - 1)) * iw : iw / 2);
        const y = pad.top + ih - ((d.accuracy - minV) / range) * ih;
        return { x, y, ...d };
      });

      const gridLines = [0, 0.25, 0.5, 0.75, 1].map(r => {
        const y = pad.top + ih * (1 - r);
        const label = Math.round(minV + range * r);
        return `<line x1="${pad.left}" y1="${y}" x2="${w - pad.right}" y2="${y}" stroke="#DEE5ED" stroke-width="1"/>
                <text x="${pad.left - 4}" y="${y + 4}" text-anchor="end" font-size="11" fill="#667589">${label}%</text>`;
      }).join('');

      const polyline = points.map(p => `${Math.round(p.x)},${Math.round(p.y)}`).join(' ');

      const dots = points.map(p =>
        `<circle cx="${Math.round(p.x)}" cy="${Math.round(p.y)}" r="3" fill="#006BD1" stroke="#fff" stroke-width="1.5"/>`
      ).join('');

      // 日期标签（最多显示 8 个）
      const step = Math.max(1, Math.floor(count / 8));
      const labels = points.filter((_, i) => i % step === 0 || i === count - 1)
        .map(p => `<text x="${Math.round(p.x)}" y="${h - 6}" text-anchor="middle" font-size="10" fill="#667589">${esc(p.date || '')}</text>`)
        .join('');

      return `<svg width="${w}" height="${h}" style="max-width:100%;display:block;">
        ${gridLines}
        <polyline points="${polyline}" fill="none" stroke="#006BD1" stroke-width="2" stroke-linejoin="round"/>
        ${dots}
        ${labels}
      </svg>`;
    }

    (async function load() {
      const id = getParam('id');
      if (!id) { showError('缺少学生 ID'); hideLoading('loading-indicator'); return; }

      try {
        const d = await apiCall('/teacher/students/' + id + '/');

        // 基本信息
        document.getElementById('student-name').textContent = d.name || '未知';
        document.getElementById('student-avatar').textContent = (d.name || '?').charAt(0);
        document.getElementById('student-id').textContent = '学号: ' + (d.studentId || '—');
        document.getElementById('student-class').textContent = d.className || '未分配';
        document.getElementById('student-school').textContent = d.school || '未填写学校';
        document.getElementById('student-registered').textContent = '注册于 ' + (d.registeredAt || '');

        // 概览卡片
        const ov = d.overview || {};
        document.getElementById('ov-total-questions').textContent = ov.totalQuestions ?? 0;
        document.getElementById('ov-accuracy').textContent = (ov.avgAccuracy ?? 0) + '%';
        document.getElementById('ov-accuracy').style.color = accuracyColor(ov.avgAccuracy);
        document.getElementById('ov-streak').textContent = ov.streakDays ?? 0;
        document.getElementById('ov-weekly').textContent = ov.weeklyQuestions ?? 0;

        // 正确率趋势（SVG 折线图）
        document.getElementById('trend-chart').innerHTML = renderTrendSvg(d.accuracyTrend || []);

        // 薄弱知识点
        const tags = d.weakTags || [];
        const tagContainer = document.getElementById('weak-tags');
        tagContainer.innerHTML = '';
        if (tags.length === 0) {
          tagContainer.innerHTML = '<div class="text-center" style="padding:12px;color:var(--text-muted);font-size:13px;">暂无薄弱知识点数据</div>';
        } else {
          tags.forEach(t => {
            tagContainer.innerHTML += `
              <div style="display:flex;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);">
                <div style="flex:1;font-weight:500;">${esc(t.name)}</div>
                <div style="text-align:right;margin-right:16px;">
                  <div style="font-size:12px;color:var(--text-secondary);">正确率</div>
                  <div style="font-size:16px;font-weight:700;color:${accuracyColor(t.accuracy)};">${esc(t.accuracy)}</div>
                </div>
                <div style="text-align:right;">
                  <div style="font-size:12px;color:var(--text-secondary);">答错题数</div>
                  <div style="font-size:14px;">${t.count ?? 0}</div>
                </div>
              </div>`;
          });
        }

        // 各题型表现
        const breakdown = d.questionTypeBreakdown || [];
        const breakdownContainer = document.getElementById('type-breakdown');
        breakdownContainer.innerHTML = '';
        if (breakdown.length === 0) {
          breakdownContainer.innerHTML = '<div class="text-center" style="padding:12px;color:var(--text-muted);font-size:13px;">暂无题型数据</div>';
        } else {
          breakdownContainer.innerHTML = '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;">';
          breakdown.forEach(item => {
            breakdownContainer.innerHTML += `
              <div style="text-align:center;">
                <div style="font-size:28px;font-weight:700;color:${accuracyColor(item.accuracy)};">${item.accuracy}%</div>
                <div style="font-size:13px;color:var(--text-secondary);">${esc(item.type)}</div>
                <div style="font-size:12px;color:var(--text-muted);">${item.correctCount ?? 0}/${item.count ?? 0}</div>
              </div>`;
          });
          breakdownContainer.innerHTML += '</div>';
        }

        document.getElementById('content').style.display = 'block';
      } catch (e) {
        showError('加载学生数据失败: ' + e.message);
      } finally {
        hideLoading('loading-indicator');
      }
    })();

    function accuracyColor(val) {
      if (val == null) return 'var(--text-muted)';
      const n = parseFloat(val);
      if (isNaN(n)) return 'var(--text-muted)';
      if (n >= 80) return 'var(--success)';
      if (n >= 60) return 'var(--warning)';
      return 'var(--error)';
    }
  </script>
</body>
</html>
