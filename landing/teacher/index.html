<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>章鱼智学 · 教师端</title>
  <link rel="stylesheet" href="teacher-styles.css">
</head>
<body class="has-header">
  <header class="top-header">
    <div class="header-inner">
      <a href="index.html" class="brand">🐙 章鱼智学</a>
      <nav class="nav-links">
        <a href="index.html" class="active">作业</a>
        <a href="classes.html">班级</a>
        <a href="students.html">学生</a>
        <a href="about.html">关于</a>
      </nav>
      <div class="user-info">
        <span class="username" id="header-username">教师</span>
        <a href="login.html" style="font-size:13px;color:var(--text-muted);text-decoration:none;margin-left:8px;" onclick="handleLogout(); return false;">退出</a>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="page-header">
      <h1>已发布作业</h1>
      <div class="page-actions">
        <a href="publish.html" class="btn btn-primary">+ 发布作业</a>
      </div>
    </div>

    <div class="stats-row" id="stats-row">
      <div class="stat-card"><div class="stat-value" id="stat-total">—</div><div class="stat-label">总发布作业</div></div>
      <div class="stat-card"><div class="stat-value" style="color:var(--warning)" id="stat-active">—</div><div class="stat-label">进行中</div></div>
      <div class="stat-card"><div class="stat-value" style="color:var(--success)" id="stat-rate">—</div><div class="stat-label">平均完成率</div></div>
      <div class="stat-card"><div class="stat-value" style="color:#8B5CF6" id="stat-acc">—</div><div class="stat-label">平均正确率</div></div>
    </div>

    <div id="assign-list">
      <div class="text-center" style="padding:40px;color:var(--text-muted);font-size:14px;">
        暂无已发布的作业
      </div>
    </div>
  </div>

  <script src="teacher-common.js"></script>
  <script>
    requireAuth();

    const user = getCachedUser();
    if (user) {
      document.getElementById('header-username').textContent = user.real_name || user.username;
    }

    // T.2 将实现：加载作业列表数据
    async function loadAssignments() {
      try {
        const data = await apiCall('/teacher/assignments/');
        document.getElementById('stat-total').textContent = data.totalAssignments || 0;
        document.getElementById('stat-active').textContent = data.activeAssignments || 0;
        // 完成率/正确率将在 T.2 实现
      } catch (e) {
        // T.2 实现错误处理
      }
    }
    loadAssignments();
  </script>
</body>
</html>
