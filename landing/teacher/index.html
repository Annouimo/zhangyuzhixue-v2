<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作业列表 — 章鱼智学 · 教师端</title>
  <link rel="stylesheet" href="teacher-styles.css?v=2">
</head>
<body class="has-header">
  <header class="top-header">
    <div class="header-inner">
      <a href="index.html" class="brand"><img src="../images/logo-mark-96.png" alt="" class="brand-icon"> 章鱼智学</a>
      <nav class="nav-links">
        <a href="index.html" class="active">作业</a>
        <a href="classes.html">班级</a>
        <a href="students.html">学生</a>
        <a href="about.html">关于</a>
      </nav>
      <div class="user-info">
        <span class="username" id="header-username">教师</span>
        <a href="login.html" style="font-size:13px;color:var(--text-muted);text-decoration:none;margin-left:8px;" onclick="handleLogout(); return false;">退出</a>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="page-header">
      <h1>已发布作业</h1>
      <div class="page-actions">
        <a href="publish.html" class="btn btn-primary">+ 发布作业</a>
      </div>
    </div>

    <div id="error-msg" class="error-banner"></div>

    <div id="loading-indicator" class="text-center" style="padding:40px;color:var(--text-muted);">加载中...</div>

    <div class="stats-row" id="stats-row" style="display:none;">
      <div class="stat-card"><div class="stat-value" id="stat-total">—</div><div class="stat-label">总发布作业</div></div>
      <div class="stat-card"><div class="stat-value" style="color:var(--warning)" id="stat-active">—</div><div class="stat-label">进行中</div></div>
      <div class="stat-card"><div class="stat-value" style="color:var(--success)" id="stat-rate">—</div><div class="stat-label">平均完成率</div></div>
      <div class="stat-card"><div class="stat-value" style="color:#8B5CF6" id="stat-acc">—</div><div class="stat-label">平均正确率</div></div>
    </div>

    <div id="assign-list"></div>
  </div>

  <script src="teacher-common.js"></script>
  <script>
    initPage();

    async function load() {
      try {
        await loadAssignments();
        document.getElementById('stats-row').style.display = 'grid';
      } catch (e) {
        showError('加载作业列表失败: ' + e.message);
      } finally {
        hideLoading('loading-indicator');
      }
    }
    load();
  </script>
</body>
</html>
